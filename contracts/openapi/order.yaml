openapi: 3.1.0
info:
  title: Order API (customer)
  version: 0.1.0
  description: >
    TASK:ORD-01 quote, create and read for members (Bearer) and guests (cart checkout token, then an order access cookie).
    Prices and fees come from the server; the order is durable PENDING with an immutable snapshot and stays PROCESSING until
    ORD-02 reserves stock and creates the payment. Only COD until PAY-02/03. TASK:ORD-03 adds the OPS/FINANCE admin
    orders (list, detail, confirm-cod, cancel; Bearer + permission checked by order-service). TASK:ORD-04 adds the customer cancel
    (while the shop has not confirmed), the OPS cancel after confirmation, return handling (RETURNING / RETURNED) and OPS return
    slips (counted goods restocked once). Every response is no-store.
servers:
- url: http://localhost:8080
  description: Local Gateway
tags:
- name: Orders
  description: Member or guest checkout and order reads
- name: Order admin
  description: OPS/FINANCE (permission order.read / order.fulfill / order.cancel; PII only with order.fulfill)
paths:
  /api/v1/orders/quote:
    post:
      tags: [Orders]
      operationId: quoteOrder
      summary: Server quote for the actor's cart, address and method (2 minutes, nothing reserved)
      description: >-
        ORD-01 implemented. A Bearer decides alone (invalid is 401 INVALID_ACCESS_TOKEN, no fallback); without one the
        Checkout-Token header from POST /api/v1/carts/{cart_id}/checkout-token makes a guest bound to that cart (another
        cart_id is 404 CART_NOT_FOUND). The cart is read at cart_version (changed is 409 VERSION_CONFLICT, empty is 422
        CART_EMPTY); unit prices are the catalog effective prices (a missing or inactive variant is 409 ITEM_UNAVAILABLE,
        errors per variant_id); shipping fee and COD fee come from a stored SELF shipping quote (422 NO_SHIPPING_RULE).
        total = subtotal + shipping_fee + cod_fee; total 0 is 422 PAYMENT_AMOUNT_UNSUPPORTED, an overflow 422
        AMOUNT_OUT_OF_RANGE. VNPAY/MOMO are 422 PAYMENT_METHOD_UNAVAILABLE until PAY-02/03. A guest must give contact.email.
        quote_token is signed by order and binds actor, cart, version, address, contact, note, lines, fees and totals; it is
        not a secret and must not be logged. Dependency failure is 503 and nothing is written.
      security: [{memberBearer: []}, {checkoutToken: []}]
      x-implementation-status: implemented
      parameters:
      - {name: Accept-Language, in: header, schema: {type: string}, description: 'en gives English item names; default vi'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteRequest'}
      responses:
        '200':
          description: Quote
          headers: &headers
            X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteResponse'}
              examples:
                cod:
                  value:
                    code: OK
                    data:
                      quote_token: example-signed-quote
                      expires_at: '2026-10-20T03:02:00Z'
                      cart_id: 11111111-1111-4111-8111-111111111111
                      cart_version: 4
                      method: COD
                      shipping_address: &address {recipient_name: Synthetic Person, phone: '0912345678', province_code: '79',
                        ward_code: '26734', address_line: 1 Synthetic St}
                      items: &items
                      - {variant_id: 33333333-3333-4333-8333-333333333333, sku: TEE-M, name: Ao thun, size: M, color: Den,
                        image_url: '/api/v1/catalog/images/66666666-6666-4666-8666-666666666666?kind=thumb', quantity: 2,
                        unit_price: 150000, line_total: 300000}
                      totals: &totals {subtotal: 300000, discount_amount: 0, shipping_fee: 30000, shipping_discount: 0,
                        cod_fee: 10000, total_amount: 340000, currency: VND}
                    metadata: &meta {request_id: ord01-synthetic-request, trace_id: ord01-synthetic-trace}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Durable order from a confirmed quote
      description: >-
        ORD-01 implemented. The (actor, Idempotency-Key) lookup runs right after authentication and before any quote check:
        the same body returns the same order (also after the quote expired or prices moved); another body is 409
        IDEMPOTENCY_KEY_REUSED. Then the quote must be valid for this actor, cart_id and cart_version (else 400
        INVALID_QUOTE) and unexpired (409 QUOTE_EXPIRED). The cart must still hold exactly the quoted lines (409
        VERSION_CONFLICT) and catalog the quoted prices (409 PRICE_CHANGED, errors variant_id old=..,new=..; quote again
        and confirm, T24). One transaction writes the PENDING order, items, history, the saga row and ORDER_CREATED. Another
        key on the same cart state is 409 CART_ALREADY_ORDERED (order_no in errors for the same actor). 4xx store nothing;
        COD expires_at is created_at + 24 h. A guest gets the order_access cookie (HttpOnly, Secure, SameSite=Lax,
        Path=/api/v1/orders/{order_no}, 90 days); a retry with the same key issues one more and earlier cookies stay valid (at most 10 per order, each readable for 90 days from
        issue, checked by the server). CART_ALREADY_ORDERED for the same guest also sets an order_access cookie for that order.
      security: [{memberBearer: []}, {checkoutToken: []}]
      x-implementation-status: implemented
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '202':
          description: Order durable, being prepared (always in ORD-01); poll status_url after Retry-After
          headers:
            X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Location: {description: status_url, schema: {type: string}}
            Retry-After: {description: Seconds before the first poll, schema: {type: integer}}
            Set-Cookie: {description: 'Guest only: order_access=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/orders/{order_no}; Max-Age=7776000', schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
              examples:
                processing:
                  value: {code: OK, data: &order {order_id: 22222222-2222-4222-8222-222222222222, order_no: ORD202610000001,
                      status: PENDING, processing_status: PROCESSING, reason_code: null, status_url: /api/v1/orders/ORD202610000001,
                      retry_after_seconds: 3, version: 0, method: COD, items: *items, totals: *totals, shipping_address: *address,
                      contact: {phone: '0912345678', email: null}, note: null, created_at: '2026-10-20T03:00:30Z',
                      expires_at: '2026-10-21T03:00:30Z', allowed_actions: []}, metadata: *meta}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/orders/mine:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: The member's orders, newest first
      description: ORD-01 implemented. Member Bearer only (a guest is 401). Keyset cursor bound to the status filter (another
        filter or a broken cursor is 400 INVALID_CURSOR).
      security: [{memberBearer: []}]
      x-implementation-status: implemented
      parameters:
      - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Page
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPageResponse'}
              examples:
                page:
                  value:
                    code: OK
                    data:
                      items: [{order_no: ORD202610000001, status: PENDING, total_amount: 340000, currency: VND,
                        created_at: '2026-10-20T03:00:30Z', item_count: 1}]
                      next_cursor: null
                    metadata: *meta
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/orders/{order_no}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: One order for its owner
      description: ORD-01 implemented. A member reads its own orders (Bearer); a guest reads only the order of its
        order_access cookie (90 days from issue, checked by the server). Missing, foreign or guessed order numbers are the same 404
        ORDER_NOT_FOUND (T21). In ORD-02 a background saga reserves stock and creates the COD payment, so a new order goes
        PENDING (PROCESSING) -> CONFIRMED (READY, waiting for OPS) or -> CANCELLING -> CANCELLED (FINISHED, reason_code). In ORD-03
        OPS confirms (CONFIRMED PROCESSING) -> PACKING (PROCESSING until the SELF shipment exists, then READY) -> SHIPPING
        (READY) -> DELIVERED (FINISHED); a saga in MANUAL stays PROCESSING. No lookup by
        order_no or phone alone. PENDING is processing_status PROCESSING. In ORD-04 a shipment that comes back moves SHIPPING ->
        RETURNING (READY, waiting for the goods, no polling) -> RETURNED (FINISHED, after OPS counted the goods and the payment
        is closed); allowed_actions is ["CANCEL"] only while the order is CONFIRMED and waiting for OPS (saga WAIT_OPS), else
        empty.
      security: [{memberBearer: []}, {orderAccess: []}]
      x-implementation-status: implemented
      parameters:
      - {name: order_no, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      responses:
        '200':
          description: Order
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
              examples:
                order:
                  value: {code: OK, data: *order, metadata: *meta}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/orders/{order_no}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOwnOrder
      summary: Customer cancels its own order while the shop has not confirmed it yet
      description: >-
        ORD-04 implemented. Same credential as GET (member Bearer, or the order_access cookie of this order); an order
        that is not the actor's is 404 ORDER_NOT_FOUND before anything else (T21). Then Idempotency-Key (400 INVALID_KEY) and
        body (400 INVALID_FIELDS/MALFORMED_JSON), then in one transaction locking order_sagas then orders: expected_version (409
        VERSION_CONFLICT), order CONFIRMED with saga FULFILL/WAIT_OPS (else 409 INVALID_TRANSITION, errors status current=S: a
        PENDING order, or one the shop already confirmed, is cancelled by contacting the shop), no live worker lease (409
        SAGA_BUSY: reload and retry). CONFIRMED -> CANCELLING (history actor CUSTOMER with the optional reason,
        cancel_reason CUSTOMER_CANCELLED); the compensation releases stock, closes the payment and ends CANCELLED
        (reason_code CUSTOMER_CANCELLED). Same key + body replays the stored 202; another body is 409 IDEMPOTENCY_KEY_REUSED.
        No audit_logs row (audit is for admin commands). The response is the customer order view.
      security: [{memberBearer: []}, {orderAccess: []}]
      x-implementation-status: implemented
      parameters:
      - {name: order_no, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerCancelRequest'}
      responses:
        '202':
          description: Accepted; CANCELLING, poll GET until CANCELLED
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
              examples:
                cancelling:
                  value: {code: OK, data: {order_id: 22222222-2222-4222-8222-222222222222, order_no: ORD202610000001,
                      status: CANCELLING, processing_status: PROCESSING, reason_code: null, status_url: /api/v1/orders/ORD202610000001,
                      retry_after_seconds: 3, version: 4, method: COD, items: *items, totals: *totals, shipping_address: *address,
                      contact: {phone: '0912345678', email: null}, note: null, created_at: '2026-10-20T03:00:30Z',
                      expires_at: '2026-10-21T03:00:30Z', allowed_actions: []}, metadata: *meta}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CommandConflict'}
  /admin/api/v1/orders:
    get:
      tags: [Order admin]
      operationId: listAdminOrders
      summary: Orders newest first for OPS/FINANCE (OPS filters status=CONFIRMED for the call list)
      description: >-
        ORD-03 implemented. Permission order.read. status filter (order enum, else 400 INVALID_PARAMETER); q matches exactly an
        order_no (ORD + 12 digits) or, for any other value, contact_phone; a phone q needs order.fulfill (403 PERMISSION_REQUIRED).
        Keyset cursor (created_at, id) desc; limit 1..100 default 20 (else 400 INVALID_PARAMETER). contact_phone and
        contact_email are omitted (keys absent) without order.fulfill (13, FINANCE).
      security: [{bearerAuth: []}]
      x-implementation-status: implemented
      parameters:
      - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
      - {name: q, in: query, schema: {type: string}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Page
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderPageResponse'}
              examples:
                ops:
                  value:
                    code: OK
                    data:
                      items: [{order_no: ORD202610000001, status: CONFIRMED, version: 2, method: COD, total_amount: 340000,
                        created_at: '2026-10-20T03:00:30Z', expires_at: '2026-10-21T03:00:30Z', confirmed_at: '2026-10-20T03:00:32Z',
                        delivered_at: null, contact_phone: '0912345678', contact_email: null}]
                      next_cursor: null
                    metadata: *meta
                finance:
                  value:
                    code: OK
                    data:
                      items: [{order_no: ORD202610000001, status: CONFIRMED, version: 2, method: COD, total_amount: 340000,
                        created_at: '2026-10-20T03:00:30Z', expires_at: '2026-10-21T03:00:30Z', confirmed_at: '2026-10-20T03:00:32Z',
                        delivered_at: null}]
                      next_cursor: null
                    metadata: *meta
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/api/v1/orders/{order_no}:
    get:
      tags: [Order admin]
      operationId: getAdminOrder
      summary: Order with items, status history (actor, reason), expires_at and the saga (step, status, last_error)
      description: >-
        ORD-03 implemented, ORD-04 adds items[].order_item_id (the id a return slip refers to) and returns (slips, oldest
        first, each with its counted items). Permission order.read. Without order.fulfill the keys contact_phone,
        contact_email, shipping_address and note are omitted and every history reason (and slip reason) is null (13). saga is
        null only for an order without a saga row; saga step WAIT_RETURN (status WAITING) means the shipment was handed over and the
        saga waits for the shipping events or a return slip.
      security: [{bearerAuth: []}]
      x-implementation-status: implemented
      parameters:
      - {name: order_no, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      responses:
        '200':
          description: Detail
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOrderDetailResponse'}
              examples:
                packing:
                  value:
                    code: OK
                    data:
                      order_no: ORD202610000001
                      user_id: null
                      status: PACKING
                      version: 4
                      method: COD
                      currency: VND
                      subtotal: 300000
                      discount_amount: 0
                      shipping_fee: 30000
                      shipping_discount: 0
                      cod_fee: 10000
                      total_amount: 340000
                      created_at: '2026-10-20T03:00:30Z'
                      expires_at: '2026-10-21T03:00:30Z'
                      confirmed_at: '2026-10-20T03:00:32Z'
                      shipped_at: null
                      delivered_at: null
                      cancel_reason: null
                      contact_phone: '0912345678'
                      contact_email: null
                      shipping_address: *address
                      note: null
                      items: [{order_item_id: 77777777-7777-4777-8777-777777777777, variant_id: 33333333-3333-4333-8333-333333333333,
                        sku: TEE-M, name: Ao thun, size: M, color: Den, quantity: 2, unit_price: 150000, line_total: 300000}]
                      returns: []
                      history:
                      - {from_status: CONFIRMED, to_status: PACKING, actor_type: SYSTEM, actor_id: null, request_id: null,
                        created_at: '2026-10-20T03:05:01Z', reason: null}
                      saga: {intent: FULFILL, step: CREATE_SHIPMENT, status: RUNNING, inventory_state: COMMITTED, payment_state: CREATED,
                        payment_id: 55555555-5555-4555-8555-555555555591, shipment_id: null,
                        retry_count: 0, next_retry_at: '2026-10-20T03:05:01Z', last_error: null}
                    metadata: *meta
                returning:
                  value:
                    code: OK
                    data:
                      order_no: ORD202610000002
                      user_id: null
                      status: RETURNING
                      version: 7
                      method: COD
                      currency: VND
                      subtotal: 300000
                      discount_amount: 0
                      shipping_fee: 30000
                      shipping_discount: 0
                      cod_fee: 10000
                      total_amount: 340000
                      created_at: '2026-10-20T03:00:30Z'
                      expires_at: '2026-10-21T03:00:30Z'
                      confirmed_at: '2026-10-20T03:00:32Z'
                      shipped_at: '2026-10-20T08:00:00Z'
                      delivered_at: null
                      cancel_reason: RETURNED
                      items: [{order_item_id: 77777777-7777-4777-8777-777777777777, variant_id: 33333333-3333-4333-8333-333333333333,
                        sku: TEE-M, name: Ao thun, size: M, color: Den, quantity: 2, unit_price: 150000, line_total: 300000}]
                      returns: [{return_id: 88888888-8888-4888-8888-888888888888, status: COMPLETED, reason: 'Khach tu choi nhan',
                        evidence_ref: 'phieu-nhap-001', actor_id: 99999999-9999-4999-8999-999999999999,
                        created_at: '2026-10-22T03:00:00Z', updated_at: '2026-10-22T03:00:05Z',
                        items: [{order_item_id: 77777777-7777-4777-8777-777777777777, received_quantity: 2, restock_quantity: 1,
                          condition: 'Mot cai ban'}]}]
                      history:
                      - {from_status: SHIPPING, to_status: RETURNING, actor_type: SYSTEM, actor_id: null, request_id: null,
                        created_at: '2026-10-21T09:00:00Z', reason: null}
                      saga: {intent: CANCEL, step: WAIT_RETURN, status: WAITING, inventory_state: COMMITTED, payment_state: CREATED,
                        payment_id: 55555555-5555-4555-8555-555555555592, shipment_id: 55555555-5555-4555-8555-555555555593,
                        retry_count: 0, next_retry_at: '2026-11-20T09:00:00Z', last_error: null}
                    metadata: *meta
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/api/v1/orders/{order_no}/confirm-cod:
    post:
      tags: [Order admin]
      operationId: confirmCodOrder
      summary: OPS confirms a COD order after the phone call; the saga commits stock, then PACKING and the SELF shipment
      description: >-
        ORD-03 implemented. Permission order.fulfill. Checked in order: auth, Idempotency-Key (400 INVALID_KEY), body (400
        INVALID_FIELDS/MALFORMED_JSON), then in one transaction locking order_sagas then orders: expected_version (409
        VERSION_CONFLICT, errors expected_version current=N), order CONFIRMED + COD + saga FULFILL/WAIT_OPS (else 409
        INVALID_TRANSITION, errors status current=S), now < expires_at (409 ORDER_EXPIRED), no live worker lease (409
        SAGA_BUSY: reload and retry). The order
        stays CONFIRMED (processing_status PROCESSING, version + 1) until inventory commits; then CONFIRMED -> PACKING and the
        saga creates the SELF shipment (READY once it has one). After the confirm the order deadline no longer cancels:
        inventory decides (RESERVATION_EXPIRED -> CANCELLED EXPIRED). Same key + body replays the stored 202; another body
        is 409 IDEMPOTENCY_KEY_REUSED. A business 409 is not stored: a retry with the same key is evaluated again. One
        audit_logs row (ORDER_CONFIRM_COD, reason = note).
      security: [{bearerAuth: []}]
      x-implementation-status: implemented
      parameters:
      - {name: order_no, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmCodRequest'}
      responses:
        '202':
          description: Accepted; the order is still CONFIRMED, poll GET until PACKING
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandOrderResponse'}
              examples:
                confirmed:
                  value: {code: OK, data: {order_id: 22222222-2222-4222-8222-222222222222, order_no: ORD202610000001,
                      status: CONFIRMED, processing_status: PROCESSING, reason_code: null, status_url: /api/v1/orders/ORD202610000001,
                      retry_after_seconds: 3, version: 3, method: COD, items: *items, totals: *totals, shipping_address: *address,
                      contact: {phone: '0912345678', email: null}, note: null, created_at: '2026-10-20T03:00:30Z',
                      expires_at: '2026-10-21T03:00:30Z', allowed_actions: []}, metadata: *meta}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CommandConflict'}
  /admin/api/v1/orders/{order_no}/cancel:
    post:
      tags: [Order admin]
      operationId: cancelConfirmedOrder
      summary: OPS cancels an order before hand-over (CONFIRMED, PACKING) with a reason
      description: >-
        ORD-03 implemented, ORD-04 widened. Permission order.cancel. Same checks and order as confirm-cod, without the COD and
        deadline checks: a cancel is allowed past expires_at while the worker has not acted (same outcome). Allowed on
        CONFIRMED (saga WAIT_OPS or COMMIT_STOCK) and PACKING (saga CREATE_SHIPMENT or DONE), in any saga status including
        MANUAL (the way out for a stuck order); a live worker lease is 409 SAGA_BUSY. SHIPPING and later is 409
        INVALID_TRANSITION (goods are on the road: wait for RETURNING, then a return slip). CONFIRMED/PACKING -> CANCELLING
        (history actor ADMIN with the OPS reason, cancel_reason OPS_CANCELLED, ORDER_CANCELLED reason OPS_CANCELLED); the
        compensation then cancels the shipment first, restores stock already committed (release, then inventory /returns
        under the fixed key cancel:{order_id}; never before the shipment is known cancelled), closes the payment and ends
        CANCELLED (reason_code OPS_CANCELLED). If the shipment was already handed over the stock is not restored: the saga
        waits (WAIT_RETURN) for the shipping events (RETURNING, or DELIVERED when the goods arrive anyway). Without order.fulfill the response omits contact,
        shipping_address and note. Idempotency as confirm-cod; one audit_logs row (ORDER_CANCEL, reason).
      security: [{bearerAuth: []}]
      x-implementation-status: implemented
      parameters:
      - {name: order_no, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelOrderRequest'}
      responses:
        '202':
          description: Accepted; CANCELLING, poll GET until CANCELLED
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandOrderResponse'}
              examples:
                withoutFulfill:
                  value: {code: OK, data: {order_id: 22222222-2222-4222-8222-222222222222, order_no: ORD202610000001,
                      status: CANCELLING, processing_status: PROCESSING, reason_code: null, status_url: /api/v1/orders/ORD202610000001,
                      retry_after_seconds: 3, version: 3, method: COD, items: *items, totals: *totals, created_at: '2026-10-20T03:00:30Z',
                      expires_at: '2026-10-21T03:00:30Z', allowed_actions: []}, metadata: *meta}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CommandConflict'}
  /admin/api/v1/orders/{order_no}/returns:
    post:
      tags: [Order admin]
      operationId: recordOrderReturn
      summary: OPS records a return slip (counted goods); only the counted restock quantity goes back to stock, once
      description: >-
        ORD-04 implemented. Permission order.return. Checked in order: auth, Idempotency-Key (400 INVALID_KEY), body (400
        INVALID_FIELDS: items 1..100, unique order_item_id, received_quantity >= 1, 0 <= restock_quantity <=
        received_quantity, condition <= 200 characters, reason and evidence_ref required 1..500), then in one transaction
        locking order_sagas then orders: expected_version (409 VERSION_CONFLICT), order RETURNING, RETURNED (goods back
        late) or DELIVERED (return after delivery, REQ ORD-10; the order stays DELIVERED, the payment is not touched), else
        409 INVALID_TRANSITION; no live worker lease (409 SAGA_BUSY); every order_item_id belongs to the order (else 400) and
        the received total over all slips of the order stays within the ordered quantity (409 RETURN_EXCEEDS_ORDERED,
        errors field items[<order_item_id>] message ordered=N received=M requested=K; nothing is written). The slip and its
        items (status REQUESTED), the restock task and audit_logs (ORDER_RETURN) are written in one transaction; the
        background task then calls inventory /returns once per slip (key return:{return_id}, only items with
        restock_quantity > 0) and the slip becomes COMPLETED, or MANUAL when inventory refuses it (an outage is retried with the same key for as long as it takes, never MANUAL; OPS may void a MANUAL slip and count again). On a RETURNING order a
        COMPLETED slip also lets the saga close the payment and the order becomes RETURNED (poll GET). Same key + body
        replays the stored 202; another body is 409 IDEMPOTENCY_KEY_REUSED. The response is the admin order view plus
        the new slip as return. The slip reason, evidence_ref and item condition are hidden (null) without order.fulfill, like history reasons.
      security: [{bearerAuth: []}]
      x-implementation-status: implemented
      parameters:
      - {name: order_no, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnRequest'}
      responses:
        '202':
          description: Accepted; the slip is REQUESTED, poll GET (admin detail returns[] and the order status)
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReturnOrderResponse'}
              examples:
                requested:
                  value: {code: OK, data: {order_id: 22222222-2222-4222-8222-222222222222, order_no: ORD202610000002,
                      status: RETURNING, processing_status: READY, reason_code: null, status_url: /api/v1/orders/ORD202610000002,
                      retry_after_seconds: null, version: 8, method: COD, items: *items, totals: *totals, shipping_address: *address,
                      contact: {phone: '0912345678', email: null}, note: null, created_at: '2026-10-20T03:00:30Z',
                      expires_at: '2026-10-21T03:00:30Z', allowed_actions: [],
                      return: {return_id: 88888888-8888-4888-8888-888888888888, status: REQUESTED, reason: 'Khach tu choi nhan',
                        evidence_ref: 'phieu-nhap-001', actor_id: 99999999-9999-4999-8999-999999999999,
                        created_at: '2026-10-22T03:00:00Z', updated_at: '2026-10-22T03:00:00Z',
                        items: [{order_item_id: 77777777-7777-4777-8777-777777777777, received_quantity: 2, restock_quantity: 1,
                          condition: 'Mot cai ban'}]}}, metadata: *meta}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CommandConflict'}
  /admin/api/v1/orders/{order_no}/returns/{return_id}/void:
    post:
      tags: [Order admin]
      operationId: voidOrderReturn
      summary: OPS voids a MANUAL return slip so the goods can be counted again
      description: >-
        ORD-04 (PR #35 review I2). Permission order.return. Checked in order: auth, Idempotency-Key (400 INVALID_KEY), body
        (400 INVALID_FIELDS: reason required 1..500), then in one transaction locking order_sagas then orders:
        expected_version (409 VERSION_CONFLICT), order RETURNING, RETURNED or DELIVERED (else 409 INVALID_TRANSITION), no
        live worker lease (409 SAGA_BUSY), the slip belongs to the order (404 RETURN_NOT_FOUND) and is MANUAL (409
        RETURN_NOT_MANUAL, errors status current=S). A slip goes MANUAL only when inventory refused its restock, which writes
        no stock, so the VOIDED slip leaves the received sum and a new slip may count the goods again. audit_logs
        ORDER_RETURN_VOID, orders.version + 1. Same key + body replays the stored 202.
      security: [{bearerAuth: []}]
      x-implementation-status: implemented
      parameters:
      - {name: order_no, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      - {name: return_id, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoidReturnRequest'}
      responses:
        '202':
          description: Accepted; the slip is VOIDED
          headers: *headers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandOrderResponse'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CommandConflict'}
components:
  securitySchemes:
    memberBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: ADR-21 access token; decides alone when present}
    checkoutToken: {type: apiKey, in: header, name: Checkout-Token, description: 'Guest proof from cart (ES256, aud order-service, 15 minutes)'}
    orderAccess: {type: apiKey, in: cookie, name: order_access, description: Guest credential of one order (sha256 stored)}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: ADR-21 access token with order.read / order.fulfill / order.cancel / order.return}
  headers:
    NoStore:
      description: Orders are per actor and hold PII; never cached, errors included.
      schema: {type: string, const: no-store}
  schemas:
    OrderStatus:
      type: string
      enum: [PENDING, WAITING_PAYMENT, CONFIRMED, PAID, PACKING, SHIPPING, DELIVERED, CANCELLING, CANCELLED, REFUNDING, REFUNDED,
        RETURNING, RETURNED]
    Address:
      type: object
      additionalProperties: false
      required: [recipient_name, phone, province_code, ward_code, address_line]
      properties:
        recipient_name: {type: string, minLength: 1, maxLength: 100}
        phone: {type: string, pattern: '^\+?[0-9]{9,15}$'}
        province_code: {type: string, minLength: 1, maxLength: 10}
        ward_code: {type: string, minLength: 1, maxLength: 10}
        address_line: {type: string, minLength: 1, maxLength: 255}
    Contact:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: {type: string, pattern: '^\+?[0-9]{9,15}$'}
        email: {type: [string, 'null'], maxLength: 254, description: Required for a guest}
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [cart_id, cart_version, method, shipping_address, contact]
      properties:
        cart_id: {type: string, format: uuid}
        cart_version: {type: integer, minimum: 0}
        method: {type: string, enum: [COD, VNPAY, MOMO]}
        shipping_address: {$ref: '#/components/schemas/Address'}
        contact: {$ref: '#/components/schemas/Contact'}
        note: {type: [string, 'null'], maxLength: 500}
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [cart_id, cart_version, quote_token]
      properties:
        cart_id: {type: string, format: uuid}
        cart_version: {type: integer, minimum: 0}
        quote_token: {type: string, minLength: 1, maxLength: 65536}
    Item:
      type: object
      additionalProperties: false
      required: [variant_id, sku, name, size, color, image_url, quantity, unit_price, line_total]
      properties:
        variant_id: {type: string, format: uuid}
        sku: {type: string}
        name: {type: string}
        size: {type: string}
        color: {type: string}
        image_url: {type: [string, 'null']}
        quantity: {type: integer, minimum: 1, maximum: 99}
        unit_price: {type: integer, minimum: 0}
        line_total: {type: integer, minimum: 0}
    Totals:
      type: object
      additionalProperties: false
      required: [subtotal, discount_amount, shipping_fee, shipping_discount, cod_fee, total_amount, currency]
      properties:
        subtotal: {type: integer, minimum: 0}
        discount_amount: {type: integer, minimum: 0}
        shipping_fee: {type: integer, minimum: 0}
        shipping_discount: {type: integer, minimum: 0}
        cod_fee: {type: integer, minimum: 0}
        total_amount: {type: integer, minimum: 1}
        currency: {type: string, const: VND}
    Quote:
      type: object
      additionalProperties: false
      required: [quote_token, expires_at, cart_id, cart_version, method, shipping_address, items, totals]
      properties:
        quote_token: {type: string, minLength: 1}
        expires_at: {type: string, format: date-time}
        cart_id: {type: string, format: uuid}
        cart_version: {type: integer, minimum: 0}
        method: {type: string, enum: [COD, VNPAY, MOMO]}
        shipping_address: {$ref: '#/components/schemas/Address'}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Item'}}
        totals: {$ref: '#/components/schemas/Totals'}
    Order:
      type: object
      additionalProperties: false
      required: [order_id, order_no, status, processing_status, reason_code, status_url, retry_after_seconds, version, method, items, totals,
        shipping_address, contact, note, created_at, expires_at, allowed_actions]
      properties: &orderProperties
        order_id: {type: string, format: uuid}
        order_no: {type: string, minLength: 1, maxLength: 32}
        status: {$ref: '#/components/schemas/OrderStatus'}
        processing_status: {type: string, enum: [PROCESSING, READY, ACTION_REQUIRED, FINISHED], description: 'PENDING/CANCELLING PROCESSING (poll after retry_after_seconds), except CANCELLING waiting for handed-over goods to come back (saga WAIT_RETURN) READY; CONFIRMED READY while waiting for OPS, PROCESSING once OPS confirmed (ORD-03); PACKING PROCESSING until the SELF shipment exists, then READY; SHIPPING READY; RETURNING READY (goods on the way back, OPS counts them; ORD-04); DELIVERED/CANCELLED/RETURNED FINISHED. A MANUAL saga keeps PROCESSING'}
        reason_code: {type: [string, 'null'], description: 'CANCELLED only: OUT_OF_STOCK, RESERVE_FAILED, PAYMENT_FAILED, EXPIRED, OPS_CANCELLED (ORD-03) or CUSTOMER_CANCELLED (customer cancel, ORD-04); a shipment that came back without an earlier cancel leaves the admin cancel_reason RETURNED (ORD-04)'}
        status_url: {type: string}
        retry_after_seconds: {type: [integer, 'null'], minimum: 1}
        version: {type: integer, minimum: 0}
        method: {type: string, enum: [COD, VNPAY, MOMO]}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Item'}}
        totals: {$ref: '#/components/schemas/Totals'}
        shipping_address: {$ref: '#/components/schemas/Address'}
        contact: {$ref: '#/components/schemas/Contact'}
        note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        allowed_actions: {type: array, items: {type: string, enum: [CANCEL]}, description: 'Customer-audience actions: CANCEL while CONFIRMED and waiting for OPS (ORD-04). Admin command views carry the same list.'}
    CommandOrder:
      description: The order after an admin command; without order.fulfill shipping_address, contact and note are omitted (keys absent, 13).
      type: object
      additionalProperties: false
      required: [order_id, order_no, status, processing_status, reason_code, status_url, retry_after_seconds, version, method, items, totals,
        created_at, expires_at, allowed_actions]
      properties: *orderProperties
    CommandOrderResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data: {$ref: '#/components/schemas/CommandOrder'}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    ConfirmCodRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 0}
        note: {type: [string, 'null'], maxLength: 500, description: 'Optional call note (trimmed, blank is absent); audit_logs reason'}
    CancelOrderRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '\S', description: 'Required (trimmed, blank is 400); history reason and audit_logs reason; cancel_reason is OPS_CANCELLED'}
    VoidReturnRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '\S', description: 'Required (trimmed); audit_logs reason'}
    CustomerCancelRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 0}
        reason: {type: [string, 'null'], maxLength: 500, description: 'Optional (trimmed, blank is absent); history reason, cancel_reason is CUSTOMER_CANCELLED'}
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason, evidence_ref, items]
      properties:
        expected_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '\S', description: 'Required (trimmed); stored on the slip and audit_logs, and sent to inventory as the /returns reason'}
        evidence_ref: {type: string, minLength: 1, maxLength: 500, pattern: '\S', description: 'Required (trimmed); the paper slip or photo reference sent to inventory'}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [order_item_id, received_quantity, restock_quantity]
            properties:
              order_item_id: {type: string, format: uuid, description: 'items[].order_item_id of the admin detail; unique in the slip'}
              received_quantity: {type: integer, minimum: 1, description: 'Counted goods back; all slips of an order together stay within the ordered quantity'}
              restock_quantity: {type: integer, minimum: 0, description: 'Part of received_quantity that goes back to stock (the rest is damaged and stays out); at most received_quantity'}
              condition: {type: [string, 'null'], maxLength: 200}
    ReturnSlip:
      type: object
      additionalProperties: false
      required: [return_id, status, reason, evidence_ref, actor_id, created_at, updated_at, items]
      properties:
        return_id: {type: string, format: uuid}
        status: {type: string, enum: [REQUESTED, PROCESSING, COMPLETED, MANUAL, VOIDED], description: 'PROCESSING is reserved (unused); MANUAL only on an inventory refusal (an outage is retried, never MANUAL); VOIDED by OPS (no longer counted)'}
        reason: {type: [string, 'null'], description: 'order.fulfill only (null without it)'}
        evidence_ref: {type: [string, 'null'], description: 'order.fulfill only (null without it; OPS free text)'}
        actor_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order_item_id, received_quantity, restock_quantity, condition]
            properties:
              order_item_id: {type: string, format: uuid}
              received_quantity: {type: integer, minimum: 1}
              restock_quantity: {type: integer, minimum: 0}
              condition: {type: [string, 'null']}
    ReturnOrder:
      description: The admin command view of the order plus the slip just recorded.
      type: object
      additionalProperties: false
      required: [order_id, order_no, status, processing_status, reason_code, status_url, retry_after_seconds, version, method, items, totals,
        created_at, expires_at, allowed_actions, return]
      properties:
        <<: *orderProperties
        return: {$ref: '#/components/schemas/ReturnSlip'}
    ReturnOrderResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data: {$ref: '#/components/schemas/ReturnOrder'}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    AdminOrderSummary:
      type: object
      additionalProperties: false
      required: [order_no, status, version, method, total_amount, created_at, expires_at, confirmed_at, delivered_at]
      properties:
        order_no: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        version: {type: integer, minimum: 0}
        method: {type: string, enum: [COD, VNPAY, MOMO]}
        total_amount: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}
        delivered_at: {type: [string, 'null'], format: date-time}
        contact_phone: {type: string, description: order.fulfill only}
        contact_email: {type: [string, 'null'], description: order.fulfill only}
    AdminOrderPageResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data:
          type: object
          additionalProperties: false
          required: [items, next_cursor]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AdminOrderSummary'}}
            next_cursor: {type: [string, 'null']}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    AdminOrderDetail:
      type: object
      additionalProperties: false
      required: [order_no, user_id, status, version, method, currency, subtotal, discount_amount, shipping_fee, shipping_discount, cod_fee,
        total_amount, created_at, expires_at, confirmed_at, shipped_at, delivered_at, cancel_reason, items, returns, history, saga]
      properties:
        order_no: {type: string}
        user_id: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/OrderStatus'}
        version: {type: integer, minimum: 0}
        method: {type: string, enum: [COD, VNPAY, MOMO]}
        currency: {type: string, const: VND}
        subtotal: {type: integer, minimum: 0}
        discount_amount: {type: integer, minimum: 0}
        shipping_fee: {type: integer, minimum: 0}
        shipping_discount: {type: integer, minimum: 0}
        cod_fee: {type: integer, minimum: 0}
        total_amount: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}
        shipped_at: {type: [string, 'null'], format: date-time, description: handed_over_at of the shipping event; falls back to provider_occurred_at then receive time when DELIVERED overtakes DELIVERING (ORD-03)}
        delivered_at: {type: [string, 'null'], format: date-time}
        cancel_reason: {type: [string, 'null'], description: 'OUT_OF_STOCK, RESERVE_FAILED, PAYMENT_FAILED, EXPIRED, OPS_CANCELLED, CUSTOMER_CANCELLED or RETURNED'}
        contact_phone: {type: string, description: order.fulfill only}
        contact_email: {type: [string, 'null'], description: order.fulfill only}
        shipping_address: {$ref: '#/components/schemas/Address', description: order.fulfill only}
        note: {type: [string, 'null'], description: order.fulfill only}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order_item_id, variant_id, sku, name, size, color, quantity, unit_price, line_total]
            properties:
              order_item_id: {type: string, format: uuid, description: 'The id a return slip refers to (ORD-04)'}
              variant_id: {type: string, format: uuid}
              sku: {type: string}
              name: {type: string}
              size: {type: string}
              color: {type: string}
              quantity: {type: integer, minimum: 1}
              unit_price: {type: integer, minimum: 0}
              line_total: {type: integer, minimum: 0}
        returns:
          type: array
          items: {$ref: '#/components/schemas/ReturnSlip'}
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [from_status, to_status, actor_type, actor_id, request_id, created_at, reason]
            properties:
              from_status: {type: [string, 'null']}
              to_status: {$ref: '#/components/schemas/OrderStatus'}
              actor_type: {type: string, enum: [SYSTEM, CUSTOMER, ADMIN]}
              actor_id: {type: [string, 'null'], format: uuid}
              request_id: {type: [string, 'null'], format: uuid}
              created_at: {type: string, format: date-time}
              reason: {type: [string, 'null'], description: 'Saga reason or OPS text; always null without order.fulfill'}
        saga:
          type: [object, 'null']
          additionalProperties: false
          required: [intent, step, status, inventory_state, payment_state, payment_id, shipment_id, retry_count, next_retry_at, last_error]
          properties:
            intent: {type: string, enum: [FULFILL, CANCEL]}
            step: {type: string, description: 'e.g. RESERVE, CREATE_PAYMENT, WAIT_OPS, COMMIT_STOCK, CREATE_SHIPMENT, COMPENSATE, WAIT_RETURN (parked until a shipping event or a return slip), CLOSE_PAYMENT'}
            status: {type: string, description: 'e.g. RUNNING, COMPENSATING, DONE, MANUAL'}
            inventory_state: {type: string}
            payment_state: {type: string}
            payment_id: {type: [string, 'null'], format: uuid}
            shipment_id: {type: [string, 'null'], format: uuid}
            retry_count: {type: integer, minimum: 0}
            next_retry_at: {type: [string, 'null'], format: date-time}
            last_error: {type: [string, 'null']}
    AdminOrderDetailResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data: {$ref: '#/components/schemas/AdminOrderDetail'}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    Summary:
      type: object
      additionalProperties: false
      required: [order_no, status, total_amount, currency, created_at, item_count]
      properties:
        order_no: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        total_amount: {type: integer, minimum: 0}
        currency: {type: string, const: VND}
        created_at: {type: string, format: date-time}
        item_count: {type: integer, minimum: 0}
    QuoteResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data: {$ref: '#/components/schemas/Quote'}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    OrderResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data: {$ref: '#/components/schemas/Order'}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    OrderPageResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data:
          type: object
          additionalProperties: false
          required: [items, next_cursor]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Summary'}}
            next_cursor: {type: [string, 'null']}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
  responses:
    Invalid:
      description: INVALID_FIELDS, INVALID_KEY, MALFORMED_JSON, INVALID_QUOTE, INVALID_CURSOR or INVALID_PARAMETER (admin list)
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            quote:
              value: {code: VALIDATION_ERROR, message: INVALID_QUOTE, metadata: *meta}
    Unauthorized:
      description: No credential, INVALID_ACCESS_TOKEN (Bearer) or INVALID_CHECKOUT_TOKEN
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            checkout:
              value: {code: UNAUTHORIZED, message: INVALID_CHECKOUT_TOKEN, metadata: *meta}
    NotFound:
      description: CART_NOT_FOUND or ORDER_NOT_FOUND; identical for missing and foreign resources
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            order:
              value: {code: NOT_FOUND, message: ORDER_NOT_FOUND, metadata: *meta}
    Conflict:
      description: VERSION_CONFLICT, ITEM_UNAVAILABLE, PRICE_CHANGED, QUOTE_EXPIRED, IDEMPOTENCY_KEY_REUSED or CART_ALREADY_ORDERED
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            price:
              value: {code: PRICE_CHANGED, message: PRICE_CHANGED,
                errors: [{field: 33333333-3333-4333-8333-333333333333, message: 'old=150000,new=155000'}], metadata: *meta}
    Forbidden:
      description: PERMISSION_REQUIRED (admin; also a phone q without order.fulfill)
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            permission:
              value: {code: FORBIDDEN, message: PERMISSION_REQUIRED, metadata: *meta}
    CommandConflict:
      description: >-
        VERSION_CONFLICT (errors expected_version current=N), INVALID_TRANSITION (errors status current=S), ORDER_EXPIRED
        (confirm-cod only), SAGA_BUSY (a worker holds the saga; reload), RETURN_EXCEEDS_ORDERED (returns only; errors field
        items[<order_item_id>] message ordered=N received=M requested=K; a VOIDED slip does not count), RETURN_NOT_MANUAL (void only; errors status current=S) or IDEMPOTENCY_KEY_REUSED (also another OPS reusing a slip key on the same order). Business 409s are not stored by idempotency; a retry is evaluated again.
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            transition:
              value: {code: CONFLICT, message: INVALID_TRANSITION, errors: [{field: status, message: current=PACKING}], metadata: *meta}
            exceeded:
              value: {code: CONFLICT, message: RETURN_EXCEEDS_ORDERED,
                errors: [{field: 'items[77777777-7777-4777-8777-777777777777]', message: 'ordered=2 received=1 requested=2'}], metadata: *meta}
    Unprocessable:
      description: CART_EMPTY, PAYMENT_METHOD_UNAVAILABLE, NO_SHIPPING_RULE, VARIANT_NOT_AVAILABLE, AMOUNT_OUT_OF_RANGE or PAYMENT_AMOUNT_UNSUPPORTED
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            empty:
              value: {code: VALIDATION_ERROR, message: CART_EMPTY, metadata: *meta}
    Unavailable:
      description: Cart, catalog or shipping could not answer; nothing was written. Retry with the same Idempotency-Key.
      headers: *headers
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            dependency:
              value: {code: TEMPORARILY_UNAVAILABLE, message: DEPENDENCY_UNAVAILABLE, metadata: *meta}
