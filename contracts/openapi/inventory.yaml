  /admin/api/v1/inventory/skus/{sku}/transactions:
    get:
      operationId: listStockTransactions
      summary: Read immutable ledger
      description: Requires inventory.read. Newest (created_at,id) first, SKU missing returns 404; cursor timestamp must fit
        UTC years 1..9999.
      tags:
      - Stock admin
      x-implementation-status: implemented
      security:
      - bearerAuth: []
      parameters:
      - name: sku
        in: path
        required: true
        description: ASCII SKU; trimmed and normalized to uppercase
        schema:
          type: string
      - $ref: ./common.yaml#/components/parameters/Limit
      - name: cursor
        in: query
        description: Base64url SKU for stock; base64url JSON {t,id} for newest-first ledger. Invalid cursor returns 400.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success with a consistent stock/version snapshot
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPageResponse'
              example:
                code: OK
                data:
                  items:
                  - id: 4c8a1f2e-0000-4000-8000-000000000004
                    type: ADJUST
                    on_hand_delta: 5
                    reserved_delta: 0
                    reason: delivery
                    actor_id: 4c8a1f2e-0000-4000-8000-000000000005
                    order_id: null
                    created_at: '2026-10-16T00:00:00Z'
                  next_cursor: null
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: VALIDATION_ERROR
                message: VALIDATION_ERROR
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: UNAUTHORIZED
                message: UNAUTHORIZED
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
