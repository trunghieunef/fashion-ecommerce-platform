openapi: 3.1.0
info:
  title: Inventory API
  version: 0.1.0
  description: TASK:INV-01 stock authority and immutable ledger; admin ES256 permissions checked at service, internal ADR-19
    service tokens. INV-02 reservation contracts; runtime implementation is verified separately.
servers:
- url: http://localhost:8080
  description: Local Gateway (admin only)
tags:
- name: Stock admin
  description: OPS stock and ledger
- name: Internal stock
  description: Private service-to-service stock reads
- name: Internal reservations
  description: Private order-service reservation commands and reads
paths:
  /admin/api/v1/inventory/skus:
    get:
      operationId: listStock
      summary: List stock by SKU
      description: Requires inventory.read. Prefix is ASCII, trimmed and uppercased; literal prefix, SKU keyset ascending.
        End page has null next_cursor.
      tags:
      - Stock admin
      x-implementation-status: implemented
      security:
      - bearerAuth: []
      parameters:
      - name: sku_prefix
        in: query
        schema:
          type: string
          maxLength: 64
      - $ref: ./common.yaml#/components/parameters/Limit
      - name: cursor
        in: query
        description: Base64url SKU for stock; base64url JSON {t,id} for newest-first ledger. Invalid cursor returns 400.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success with a consistent stock/version snapshot
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPageResponse'
              example:
                code: OK
                data:
                  items:
                  - sku: SKU-1
                    variant_id: 4c8a1f2e-0000-4000-8000-000000000002
                    product_id: 4c8a1f2e-0000-4000-8000-000000000003
                    on_hand: 5
                    reserved: 2
                    available: 3
                    min_stock: 0
                    status: ACTIVE
                    version: 1
                  next_cursor: null
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: VALIDATION_ERROR
                message: VALIDATION_ERROR
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: UNAUTHORIZED
                message: UNAUTHORIZED
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: FORBIDDEN
                message: FORBIDDEN
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '500':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: INTERNAL
                message: INTERNAL
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '503':
