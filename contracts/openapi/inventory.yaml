  /admin/api/v1/inventory/import:
    post:
      operationId: importInboundStock
      summary: Import inbound CSV atomically
      description: Requires inventory.adjust. UTF-8, optional BOM, LF/CRLF, exact sku,quantity header; no quoted cells; 1..1000
        data rows, quantity 1..1000000, no duplicate canonical SKU. File <=128 KiB, multipart <=160 KiB. Strip reason 1..500.
        Validate every row/unknown SKU/overflow before writing; errors use rows[n].sku/quantity (header line 1). INBOUND adds
        quantity, never overwrites on_hand. Idempotency hashes raw file bytes SHA-256 plus stripped reason; replay stored
        data/status with fresh metadata; ledger key user:<actor>:inventory.import:<key>.
      tags:
      - Stock admin
      x-implementation-status: implemented
      security:
      - bearerAuth: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Success with a consistent stock/version snapshot
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultResponse'
              example:
                code: OK
                data:
                  rows: 1
                  total_quantity: 5
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: VALIDATION_ERROR
                message: VALIDATION_ERROR
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: UNAUTHORIZED
                message: UNAUTHORIZED
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: FORBIDDEN
                message: FORBIDDEN
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '409':
          description: Idempotency body conflict or ON_HAND_BELOW_RESERVED
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: CONFLICT
                message: CONFLICT
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '413':
          description: Multipart file exceeds 128 KiB or request exceeds 160 KiB
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: VALIDATION_ERROR
                message: VALIDATION_ERROR
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '500':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: INTERNAL
                message: INTERNAL
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '503':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
