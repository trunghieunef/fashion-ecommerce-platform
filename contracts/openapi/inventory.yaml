                message: VALIDATION_ERROR
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: UNAUTHORIZED
                message: UNAUTHORIZED
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: FORBIDDEN
                message: FORBIDDEN
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '404':
          description: SKU_NOT_FOUND
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: NOT_FOUND
