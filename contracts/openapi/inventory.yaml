              example:
                code: FORBIDDEN
                message: FORBIDDEN
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '404':
          description: SKU_NOT_FOUND
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: NOT_FOUND
                message: SKU_NOT_FOUND
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '500':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: INTERNAL
                message: INTERNAL
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '503':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: TEMPORARILY_UNAVAILABLE
                message: TEMPORARILY_UNAVAILABLE
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
  /admin/api/v1/inventory/adjust:
    post:
      operationId: adjustStock
      summary: Apply signed stock delta
      description: 'Requires inventory.adjust. One transaction: lock SKU, stock/version update, immutable ADJUST ledger and
        snapshot outbox. No stock below reserved; integer overflow is 400 field delta. Idempotency scoped actor/operation/key;
        hash canonical SKU/reason/body, replay stored data/status with new metadata. Ledger key user:<actor>:inventory.adjust:<key>.'
      tags:
      - Stock admin
      x-implementation-status: implemented
      security:
      - bearerAuth: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Success with a consistent stock/version snapshot
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
              example:
                code: OK
                data:
                  sku: SKU-1
                  variant_id: 4c8a1f2e-0000-4000-8000-000000000002
                  product_id: 4c8a1f2e-0000-4000-8000-000000000003
                  on_hand: 5
                  reserved: 2
                  available: 3
                  min_stock: 0
                  status: ACTIVE
                  version: 1
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: VALIDATION_ERROR
                message: VALIDATION_ERROR
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: UNAUTHORIZED
                message: UNAUTHORIZED
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          description: Safe error envelope
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/ApiError
              example:
                code: FORBIDDEN
                message: FORBIDDEN
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '404':
          description: SKU_NOT_FOUND
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
          content:
