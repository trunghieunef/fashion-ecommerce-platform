                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - reason
