  /internal/api/v1/inventory/skus/{sku}:
    get:
      operationId: getInternalStock
      summary: Read internal availability
      description: ADR-19 ES256 service token audience inventory-service. Fixed callers catalog-service/cart-service with
        configured public keys. Verify token/caller before SKU validation. observed_at is updated_at from the same stock/version
        row. Not routed by Gateway.
      tags:
      - Internal stock
      x-implementation-status: implemented
      security:
      - serviceToken: []
      parameters:
      - name: sku
        in: path
        required: true
        description: ASCII SKU; trimmed and normalized to uppercase
        schema:
          type: string
      responses:
        '200':
          description: Success with a consistent stock/version snapshot
          headers:
            X-Correlation-Id:
              $ref: ./common.yaml#/components/headers/CorrelationId
            Cache-Control:
              description: Never cache internal stock or its errors
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalStockResponse'
              example:
                code: OK
                data:
                  sku: SKU-1
                  variant_id: 4c8a1f2e-0000-4000-8000-000000000002
                  available: 3
                  version: 1
                  observed_at: '2026-10-16T00:00:00Z'
                metadata:
                  request_id: 4c8a1f2e-0000-4000-8000-000000000001
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
