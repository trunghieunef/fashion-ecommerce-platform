      summary: Create ACTIVE variant and transactional VARIANT_CREATED outbox intent
      description: New SKUs are stripped, validated as ASCII and uppercased before hashing or persistence. Uniqueness ignores ASCII casing. Legacy SKU identities and completed idempotency responses remain unchanged.
      security:
      - bearerAuth: []
