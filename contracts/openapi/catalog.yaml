  /admin/api/v1/catalog/collections:
    get:
      operationId: listAdminCollections
      summary: List collection summaries ordered by created_at DESC then id DESC
      description: Requires catalog.write; includes all statuses, no public visibility filtering or product items. CAT-01b admin read implemented.
      security:
      - bearerAuth: []
      parameters:
      - {$ref: ./common.yaml#/components/parameters/Page}
      - {$ref: ./common.yaml#/components/parameters/Size}
      - in: query
        name: status
        schema: {type: string, enum: [DRAFT, ACTIVE, INACTIVE]}
      responses:
        '200': {$ref: '#/components/responses/CollectionsSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
    post:
      operationId: createCollection
      summary: Create a DRAFT collection at version 0
      description: >
        CAT-01b collection mutation implemented. Requires catalog.write.
        Idempotency-Key is mandatory. At most 1000 items; empty collections and unpublished
        products are allowed. Unknown item product_id returns 400 VALIDATION_ERROR with
        field items[i].product_id. Duplicate product_id returns 400. sort_order may tie.
        Timestamps require an ISO-8601 offset and UTC year 1..9999. Convert to UTC and truncate
        to microseconds before comparison, idempotency hash and storage. Null bounds are unbounded;
        when both exist, end_at must be greater than start_at after truncation. cover_url and lookbook fields
        are not accepted; cover_url remains null and validated media belongs to CAT-03.
      security:
      - bearerAuth: []
      parameters:
      - {$ref: ./common.yaml#/components/parameters/IdempotencyKey}
      responses:
        '201': {$ref: '#/components/responses/CreatedCollectionSuccess'}
        '400': {$ref: '#/components/responses/CollectionValidationError'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '415': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionCreate'}
            examples:
              request:
                value:
                  name_vi: Bộ sưu tập mẫu
                  name_en: Sample collection
                  slug: sample-collection
                  start_at: '2026-10-08T09:00:00+07:00'
                  end_at: null
                  items: [{product_id: 33333333-3333-4333-8333-333333333333, sort_order: 0}]
  /admin/api/v1/catalog/collections/{id}:
    get:
      operationId: getAdminCollection
      summary: Read an admin collection with ordered items and its edit version
      description: >
        CAT-01b admin read implemented. Requires catalog.write at the service.
        Includes DRAFT/INACTIVE data without public visibility filtering. Items are ordered by
        sort_order, then product_id. The collection version is the expected_version for PUT.
        Detail uses one SQL json_agg ordered by sort_order/product_id, so content and version share a snapshot.
        cover_url is always null; lookbook is deferred to CAT-03. Public collection reads belong to CAT-02.
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {$ref: '#/components/responses/CollectionSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/CollectionNotFound'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
    put:
      operationId: updateCollection
      summary: Replace collection content and items using its expected version
      description: >
        CAT-01b collection mutation implemented. Requires catalog.write and
        expected_version, without requiring Idempotency-Key, as with CAT-01a PUT.
        Replaces the content and entire item list; increments version by one. Status can
        be DRAFT, ACTIVE or INACTIVE. ACTIVE does not require an ACTIVE product.
        Collection row lock, replacement, version increment and audit share one transaction.
        Unknown item product_id returns 400 VALIDATION_ERROR with field items[i].product_id;
        only a missing path resource returns 404. At most 1000 items; duplicates are invalid,
        empty lists and unpublished products are allowed. sort_order may tie, read order is
        sort_order then product_id. Timestamps require an ISO-8601 offset, stored in UTC;
        null bounds are unbounded and end_at must exceed start_at when both exist.
        cover_url and lookbook fields are rejected; cover_url remains null. Media is CAT-03.
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {$ref: '#/components/responses/CollectionSuccess'}
        '400': {$ref: '#/components/responses/CollectionValidationError'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/CollectionNotFound'}
        '409': {$ref: '#/components/responses/Error409'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '415': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionUpdate'}
            examples:
              request:
                value:
                  name_vi: Bộ sưu tập mẫu
                  name_en: Sample collection
                  slug: sample-collection
                  start_at: '2026-10-08T09:00:00+07:00'
                  end_at: null
                  status: ACTIVE
                  expected_version: 1
                  items: []
  /admin/api/v1/catalog/size-guides/{category_id}/{locale}:
    get:
      operationId: getAdminSizeGuide
      summary: Read an admin size guide and its edit version
      description: >
        CAT-01b guide admin read implemented. Requires catalog.write at the service.
        Includes guides for DRAFT/INACTIVE catalog data. Missing guide returns 404 NOT_FOUND;
        locale outside vi/en returns 400. The returned version is the expected_version for PUT.
        Public size guide reads belong to CAT-02.
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/CategoryId'}
      - {$ref: '#/components/parameters/GuideLocale'}
      responses:
        '200': {$ref: '#/components/responses/SizeGuideSuccess'}
        '400': {$ref: '#/components/responses/InvalidGuideLocale'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/SizeGuideNotFound'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
    put:
      operationId: putSizeGuide
      summary: Create or replace a size guide with idempotency and expected version
      description: >
        Implemented CAT-01b contract, verified with PostgreSQL and local Gateway smoke. Requires catalog.write.
        Unlike CAT-01a PUT, Idempotency-Key is mandatory because this PUT can create.
        expected_version=0 creates an absent guide with 201 and version=1; updating uses
        its current version, returns 200 and increments version. Missing version returns
        400; an existing guide with expected_version=0 or any stale version returns 409
        VERSION_CONFLICT. Independent concurrent creates use UNIQUE(category_id, locale),
        yielding one 201 and other requests 409 VERSION_CONFLICT. Same-key/body retries
        replay stored data/status before the version check, with new metadata and no audit;
        changed body with the same key returns 409 IDEMPOTENCY_KEY_REUSED.
        locale is exactly vi/en; invalid locale returns 400, missing category returns 404.
        Processing order is auth, validate, category path check, idempotency, version guard;
        category is checked before replay lookup as well. Create uses INSERT ON CONFLICT
        (category_id, locale) DO NOTHING RETURNING; an empty result is VERSION_CONFLICT,
        without catching a unique violation that would abort the idempotency transaction.
        guideline_html is optional: omitted/null becomes empty, sanitized with the product
        jsoup policy, at most 20000 characters after sanitizing. table_json is required;
        strip headers/cells, enforce equal row width, case-insensitive distinct headers using
        toLowerCase(Locale.ROOT) after strip, and at most 32768 UTF-8 bytes of compact normalized JSON.
        Unknown request fields are collected by JsonAnySetter and return 400 with field equal
        to the top-level key name or table_json.<key> for nested table keys;
        global Jackson fail-on-unknown=false and CAT-01a remain unchanged.
        Mutation, audit and idempotency result share one transaction.
      security:
      - bearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/CategoryId'}
      - {$ref: '#/components/parameters/GuideLocale'}
      - {$ref: ./common.yaml#/components/parameters/IdempotencyKey}
      responses:
        '201': {$ref: '#/components/responses/CreatedSizeGuideSuccess'}
        '200': {$ref: '#/components/responses/SizeGuideSuccess'}
        '400': {$ref: '#/components/responses/InvalidGuideLocale'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/SizeGuideCategoryNotFound'}
        '409': {$ref: '#/components/responses/SizeGuideConflict'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '415': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SizeGuidePut'}
            examples:
              create:
                value: {expected_version: 0, table_json: {columns: [Size, Ngực (cm)], rows: [[M, '96–100']]}}
              update:
                value: {expected_version: 1, guideline_html: '<p>Đo vòng ngực để chọn size.</p>', table_json: {columns: [Size, Ngực (cm)], rows: [[M, '96–100']]}}
