        end_at: {type: [string, 'null'], format: date-time, description: ISO-8601 timestamp with offset; stored in UTC. Null is an unbounded end; must exceed start_at when both exist.}
        items:
          type: array
          maxItems: 1000
          description: Entire replacement list. Unique product_id enforced by the service; unknown IDs return 400 at items[i].product_id. sort_order may tie.
          items: {$ref: '#/components/schemas/AdminCollectionItem'}
    CollectionCreate:
      allOf:
      - {$ref: '#/components/schemas/CollectionContent'}
      unevaluatedProperties: false
      description: Creates DRAFT/version 0. cover_url/lookbook and all unknown keys are rejected via JsonAnySetter with field equal to the key name; global fail-on-unknown=false and CAT-01a remain unchanged.
    CollectionUpdate:
      allOf:
      - {$ref: ./common.yaml#/components/schemas/ExpectedVersion}
      - {$ref: '#/components/schemas/CollectionContent'}
      - type: object
        required: [status]
        properties:
          status: {type: string, enum: [DRAFT, ACTIVE, INACTIVE]}
      unevaluatedProperties: false
      description: Full replacement using expected_version only; no Idempotency-Key required. Unknown keys including cover_url/lookbook are collected by JsonAnySetter and rejected with field equal to the key name, without changing global Jackson behavior.
    SizeGuideTable:
      type: object
      additionalProperties: false
      required: [columns, rows]
      description: >
        Plain text only; FE must escape cells and headers. Headers/cells are stripped before storage.
        Each row must have exactly the column count; compact normalized JSON must not exceed 32768 UTF-8 bytes.
        Distinct headers are checked case-insensitively after strip using Locale.ROOT, retaining display casing.
        First column matching variant.size is a content convention, not an enforced constraint.
      properties:
        columns:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: array
            minItems: 1
            maxItems: 20
            items: {type: string, minLength: 0, maxLength: 100}
    AdminSizeGuide:
      type: object
      additionalProperties: false
      required: [id, category_id, locale, guideline_html, table_json, version]
      properties:
        id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
        locale: {type: string, enum: [vi, en]}
        guideline_html: {type: string, maxLength: 20000, description: Sanitized with the product jsoup policy; omitted/null input is stored as empty string.}
        table_json: {$ref: '#/components/schemas/SizeGuideTable'}
        version: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
    SizeGuidePut:
      allOf:
      - {$ref: ./common.yaml#/components/schemas/ExpectedVersion}
      - type: object
        required: [table_json]
        properties:
          guideline_html:
            type: [string, 'null']
            description: Optional; omitted/null becomes empty string. Sanitize with the product jsoup policy, then enforce at most 20000 characters.
          table_json:
            description: Require columns/rows only. Length limits apply after strip; row width, case-insensitive headers, plain-text handling and compact normalized 32768 UTF-8 byte limit are enforced by the service.
            type: object
            additionalProperties: false
            required: [columns, rows]
            properties:
              columns:
                type: array
                minItems: 1
                maxItems: 20
                items: {type: string, description: Strip then validate 1..100 characters; compare distinct headers with toLowerCase(Locale.ROOT) and retain display casing.}
              rows:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, description: Strip then validate 0..100 characters.}
      unevaluatedProperties: false
    CollectionResponse:
      type: object
      additionalProperties: false
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data: {$ref: '#/components/schemas/AdminCollection'}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    SizeGuideResponse:
      type: object
      additionalProperties: false
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data: {$ref: '#/components/schemas/AdminSizeGuide'}
        metadata: {$ref: ./common.yaml#/components/schemas/Metadata}
    AdminInternalError:
      allOf:
        - {$ref: ./common.yaml#/components/schemas/ApiError}
        - maxProperties: 3
          properties:
            code: {const: INTERNAL}
            message: {const: INTERNAL_ERROR}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: ADR-21 ES256; catalog.write required at catalog-service.}
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
      description: Resource UUID
    CategoryId:
      in: path
      name: category_id
      required: true
      schema: {type: string, format: uuid}
      description: Category UUID
    GuideLocale:
