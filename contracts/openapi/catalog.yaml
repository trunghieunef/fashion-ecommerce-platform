          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
        "503":
          "$ref": "#/components/responses/Error503"
components:
  schemas:
    ImageUploadCreate:
      type: "object"
      additionalProperties: false
      required: ["filename","content_type","size_bytes","target_type","target_id"]
      properties:
        filename:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Strip; plain text; frontend escapes output."
        content_type:
          type: "string"
          enum: ["image/jpeg","image/png"]
        size_bytes:
          type: "integer"
          minimum: 1
          maximum: 5242880
        target_type:
          type: "string"
          enum: ["PRODUCT","COLLECTION"]
        target_id:
          type: "string"
          format: "uuid"
    ImageObjectMetadata:
      type: "object"
      additionalProperties: false
      required: ["content_type","size_bytes","width","height","sha256"]
      properties:
        content_type:
          type: "string"
          enum: ["image/jpeg","image/png"]
        size_bytes:
          type: "integer"
          minimum: 1
          maximum: 5242880
        width:
          type: "integer"
          minimum: 1
          maximum: 2560
        height:
          type: "integer"
          minimum: 1
          maximum: 2560
        sha256:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
    ApprovedImageAsset:
      type: "object"
      additionalProperties: false
      required: ["asset_id","image","thumb","url","thumb_url"]
      properties:
        asset_id:
          type: "string"
          format: "uuid"
        image:
          "$ref": "#/components/schemas/ImageObjectMetadata"
        thumb:
          "$ref": "#/components/schemas/ImageObjectMetadata"
          description: "Longest edge <=800, no upscale."
        url:
          type: "string"
          description: "Controlled Gateway path; visibility checked on each read."
        thumb_url:
          type: "string"
    ImageUploadIntent:
      type: "object"
      additionalProperties: false
      required: ["upload_id","put_expires_at","complete_deadline","put_url","put_headers"]
      properties:
        upload_id:
          type: "string"
          format: "uuid"
        put_expires_at:
          type: "string"
          format: "date-time"
        complete_deadline:
          type: "string"
          format: "date-time"
        put_url:
          type: "string"
          format: "uri"
          description: "Sensitive presigned capability. Never log, audit or persist in idempotency body. Example is unsigned."
        put_headers:
          type: "object"
          additionalProperties: false
          required: ["Content-Type","Content-Length"]
          properties:
            Content-Type:
              type: "string"
              enum: ["image/jpeg","image/png"]
            Content-Length:
              type: "integer"
              minimum: 1
              maximum: 5242880
    ImageUploadStatus:
      type: "object"
      additionalProperties: false
      required: ["upload_id","target_type","target_id","state","put_expires_at","complete_deadline","lease_until","reason_code","asset","asset_availability"]
      properties:
        upload_id:
          type: "string"
          format: "uuid"
        target_type:
          type: "string"
          enum: ["PRODUCT","COLLECTION"]
        target_id:
          type: "string"
          format: "uuid"
        state:
          type: "string"
          enum: ["PENDING","PROCESSING","APPROVED","REJECTED","EXPIRED"]
        put_expires_at:
          type: "string"
          format: "date-time"
        complete_deadline:
          type: "string"
          format: "date-time"
        lease_until:
          type: ["string","null"]
          format: "date-time"
        reason_code:
          type: ["string","null"]
        asset:
          anyOf: [{"$ref":"#/components/schemas/ApprovedImageAsset"},{"type":"null"}]
        asset_availability:
          type: [string, 'null']
          enum: [AVAILABLE, DELETING, DELETED, null]
    ProductImageInput:
      type: "object"
      additionalProperties: false
      required: ["asset_id","alt_vi","alt_en","sort_order"]
      properties:
        asset_id:
          type: "string"
          format: "uuid"
        alt_vi:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Strip; plain text; frontend escapes output."
        alt_en:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Strip; plain text; frontend escapes output."
        sort_order:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        variant_color:
          type: ["string","null"]
          description: "Exact color of a variant belonging to this product, or null."
    CollectionImageInput:
      type: "object"
      additionalProperties: false
      required: ["asset_id","sort_order"]
      properties:
        asset_id:
          type: "string"
          format: "uuid"
        sort_order:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        caption_vi:
          type: "string"
          minLength: 0
          maxLength: 500
          description: "Strip; plain text; frontend escapes output."
        caption_en:
          type: "string"
          minLength: 0
          maxLength: 500
          description: "Strip; plain text; frontend escapes output."
    ProductImagesPut:
      allOf: [{"$ref":"./common.yaml#/components/schemas/ExpectedVersion"}]
      type: "object"
      additionalProperties: false
      required: ["expected_version","images"]
      properties:
        expected_version:
          type: "integer"
          minimum: 0
          maximum: 9223372036854775807
        images:
          type: "array"
          maxItems: 20
          items:
            "$ref": "#/components/schemas/ProductImageInput"
      description: "Full replacement. New/re-attached asset must belong to uploader and target; retained assets may belong to another actor. ACTIVE cannot become empty."
    CollectionImagesPut:
      allOf: [{"$ref":"./common.yaml#/components/schemas/ExpectedVersion"}]
      type: "object"
      additionalProperties: false
      required: ["expected_version","images","cover_asset_id"]
      properties:
        expected_version:
          type: "integer"
          minimum: 0
          maximum: 9223372036854775807
        cover_asset_id:
          type: ["string","null"]
          format: "uuid"
        images:
          type: "array"
          maxItems: 50
          items:
            "$ref": "#/components/schemas/CollectionImageInput"
      description: "Full replacement. Non-null cover must belong to images in this request. No ACTIVE cover gate."
    ProductImage:
      type: "object"
      additionalProperties: false
      required: ["asset_id","image","thumb","url","thumb_url","alt_vi","alt_en","sort_order","variant_color"]
      properties:
        asset_id:
          type: "string"
          format: "uuid"
        image:
          "$ref": "#/components/schemas/ImageObjectMetadata"
        thumb:
          "$ref": "#/components/schemas/ImageObjectMetadata"
        url:
          type: "string"
        thumb_url:
          type: "string"
        alt_vi:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Strip; plain text; frontend escapes output."
        alt_en:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Strip; plain text; frontend escapes output."
        sort_order:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        variant_color:
          type: ["string","null"]
    CollectionImage:
      type: "object"
      additionalProperties: false
      required: ["asset_id","image","thumb","url","thumb_url","caption_vi","caption_en","sort_order"]
      properties:
        asset_id:
          type: "string"
          format: "uuid"
        image:
          "$ref": "#/components/schemas/ImageObjectMetadata"
        thumb:
          "$ref": "#/components/schemas/ImageObjectMetadata"
        url:
          type: "string"
        thumb_url:
          type: "string"
        caption_vi:
          type: "string"
          minLength: 0
          maxLength: 500
          description: "Strip; plain text; frontend escapes output."
        caption_en:
          type: "string"
          minLength: 0
          maxLength: 500
          description: "Strip; plain text; frontend escapes output."
        sort_order:
          type: "integer"
          minimum: 0
          maximum: 2147483647
    ProductImages:
      type: "object"
      additionalProperties: false
      required: ["id","version","images"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          minimum: 0
        images:
          type: "array"
          maxItems: 20
          items:
            "$ref": "#/components/schemas/ProductImage"
    CollectionImages:
      type: "object"
      additionalProperties: false
      required: ["id","version","images","cover_asset_id"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          minimum: 0
        cover_asset_id:
          type: ["string","null"]
          format: "uuid"
        images:
          type: "array"
          maxItems: 50
          items:
            "$ref": "#/components/schemas/CollectionImage"
    ImageIntentResponse:
      type: "object"
      additionalProperties: false
      required: ["code","data","metadata"]
      properties:
        code:
          type: "string"
          const: "OK"
        data:
          "$ref": "#/components/schemas/ImageUploadIntent"
        metadata:
          "$ref": "./common.yaml#/components/schemas/Metadata"
    ImageStatusResponse:
      type: "object"
      additionalProperties: false
      required: ["code","data","metadata"]
      properties:
        code:
          type: "string"
          const: "OK"
        data:
          "$ref": "#/components/schemas/ImageUploadStatus"
        metadata:
          "$ref": "./common.yaml#/components/schemas/Metadata"
    ApprovedImageResponse:
      type: "object"
      additionalProperties: false
      required: ["code","data","metadata"]
      properties:
        code:
          type: "string"
          const: "OK"
        data:
          "$ref": "#/components/schemas/ApprovedImageAsset"
        metadata:
          "$ref": "./common.yaml#/components/schemas/Metadata"
    ProductImagesResponse:
      type: "object"
      additionalProperties: false
      required: ["code","data","metadata"]
      properties:
        code:
          type: "string"
          const: "OK"
        data:
          "$ref": "#/components/schemas/ProductImages"
        metadata:
          "$ref": "./common.yaml#/components/schemas/Metadata"
    CollectionImagesResponse:
      type: "object"
      additionalProperties: false
      required: ["code","data","metadata"]
      properties:
        code:
          type: "string"
          const: "OK"
        data:
          "$ref": "#/components/schemas/CollectionImages"
        metadata:
          "$ref": "./common.yaml#/components/schemas/Metadata"
    ProductSummary:
      type: object
      required: [id, slug, name_vi, name_en]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, minLength: 1, maxLength: 160}
        name_vi: {type: string, minLength: 1, maxLength: 255}
        name_en: {type: string, minLength: 1, maxLength: 255}
    ProductPageResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {type: string, const: OK}
        data:
          type: object
          required: [items, next_cursor]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/ProductSummary'}
            next_cursor: {type: [string, 'null']}
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    AdminCategory:
      type: object
      additionalProperties: false
      required: [id, parent_id, name_vi, name_en, slug, sort_order, status, version]
      properties:
        id: {type: string, format: uuid}
        parent_id:
          type: [string, 'null']
          format: uuid
        name_vi: {type: string, minLength: 1, maxLength: 255}
        name_en: {type: string, minLength: 1, maxLength: 255}
        slug: {type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        sort_order: {type: integer, format: int32}
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        version: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
    AdminBrand:
      type: object
      additionalProperties: false
      required: [id, name, logo_url, status, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        logo_url:
          type: [string, 'null']
          minLength: 0
          maxLength: 500
          pattern: ^https?://
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        version: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
    AdminVariant:
      type: object
      additionalProperties: false
      required: [id, product_id, sku, size, color, price_override, weight_grams, status, version]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        sku: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$', description: 'New SKU is canonical uppercase ASCII; legacy immutable identities may retain lowercase.'}
        size: {type: string, minLength: 1, maxLength: 50}
        color: {type: string, minLength: 1, maxLength: 50}
