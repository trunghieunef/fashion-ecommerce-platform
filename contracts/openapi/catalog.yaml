openapi: 3.1.0
info:
  title: Catalog API
  version: 0.1.0
  description: >
    TASK:PLT-02 public sample and TASK:CAT-01a admin (catalog.write; ADR-21 ES256, revocation TTL 15 minutes).
    TASK:CAT-01b admin collection list/detail/mutations and size-guide GET/PUT are implemented, tested with PostgreSQL Testcontainers and exercised through the local Gateway with a synthetic OPS token.
    TASK:CAT-03 upload, complete, status and image attach operations and public/admin image reads are implemented and tested locally (PostgreSQL + RustFS Testcontainers, local Gateway smoke).
    TASK:CAT-02a public browse/detail/search/taxonomy/collections/size guides and internal variant quote are implemented and verified locally; parent CAT-02 remains In progress pending 02b.
    Public reads ignore unknown query keys. Products/search/collection list/detail tolerate repeated keys and use the first value, still enforcing its normal format and domain validation.
    Invalid limit format or values outside 1..100 return VALIDATION_ERROR / INVALID_LIMIT with field/message only (no rejected_value), metadata and X-Correlation-Id.
servers:
  - url: http://localhost:8080
    description: Local Gateway (S1-local)
paths:
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      summary: Browse public product cards
      x-implementation-status: implemented
      description: 'CAT-02a implemented. PostgreSQL public products: ACTIVE product, category and its parent if present, brand absent or ACTIVE, at
        least one ACTIVE variant. Money min/max aggregates coalesce(price_override,base_price) over ACTIVE variants. Only AVAILABLE
        images. Public JSON HTTP cache headers deferred to CAT-02b. All user values bound; min_price <= max_price. Stable tuple
        keyset with UUID tie-break; limit+1. Empty items and null next_cursor at end.'
      security: []
      parameters:
      - name: q
        in: query
        required: false
        description: Trimmed; accent-insensitive VI/EN name and slug search. Percent, underscore and backslash are literal.
        schema: {type: string, minLength: 1, maxLength: 100}
      - name: category_id
        in: query
        required: false
        description: Category itself or direct children.
        schema: {type: string, format: uuid}
      - name: brand_id
        in: query
        required: false
        description: Exact brand UUID.
        schema: {type: string, format: uuid}
      - name: size
        in: query
        required: false
        description: Trimmed; size/color case-insensitive and match the same ACTIVE variant; tag exact.
        schema: {type: string, minLength: 1, maxLength: 64}
      - name: color
        in: query
        required: false
        description: Trimmed; size/color case-insensitive and match the same ACTIVE variant; tag exact.
        schema: {type: string, minLength: 1, maxLength: 64}
      - name: tag
        in: query
        required: false
        description: Trimmed; size/color case-insensitive and match the same ACTIVE variant; tag exact.
        schema: {type: string, minLength: 1, maxLength: 64}
      - name: min_price
        in: query
        required: false
        description: Inclusive lower bound on representative min_price.
        schema: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
      - name: max_price
        in: query
        required: false
        description: Inclusive upper bound on min_price; must be >= min_price.
        schema: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
      - name: sort
        in: query
        required: false
        description: 'NEWEST: coalesce(published_at,created_at) DESC/id DESC; BEST_SELLING: sold_quantity DESC/id DESC (consumer
          deferred); PRICE_ASC min_price ASC/id ASC; PRICE_DESC min_price DESC/id DESC.'
        schema:
          type: string
          enum: [NEWEST, BEST_SELLING, PRICE_ASC, PRICE_DESC]
          default: NEWEST
      - {$ref: ./common.yaml#/components/parameters/Limit}
      - name: cursor
        in: query
        description: Opaque base64url JSON s/v/id/f, no padding; sort and normalized filter hash must match. NEWEST/COLLECTIONS
          timestamp UTC year 1..9999; price/sold integer 0..9223372036854775807; COLLECTION:<slug> sort_order 0..2147483647.
          Malformed, wrong type/domain, sort or filter mismatch returns 400 VALIDATION_ERROR / INVALID_CURSOR, field cursor.
          Product filters f use first 16 SHA-256 hex characters; collection cursors use empty f. No price or inventory reservation.
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: CAT-02a implemented response
          headers:
            X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
            Cache-Control:
              schema: {type: string, const: 'public, max-age=30'}
              description: CAT-02b; Redis TTL is separate (04 section 4).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPageResponse'}
              examples:
                success:
                  value:
                    code: OK
                    data:
                      items:
                      - id: 11111111-1111-4111-8111-111111111111
                        slug: ao-mau
                        name_vi: Áo mẫu
                        name_en: Sample tee
                        min_price: 100000
                        max_price: 120000
                        image: {asset_id: 66666666-6666-4666-8666-666666666666, alt_vi: Áo mẫu, alt_en: Sample tee}
                      - {id: 11111111-1111-4111-8111-111111111111, slug: ao-mau, name_vi: Áo mẫu, name_en: Sample tee, min_price: 100000,
                        max_price: 120000, image: null}
                      next_cursor: null
                    metadata: {request_id: cat02a-synthetic-request, trace_id: cat02a-synthetic-trace}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
        '400':
          description: INVALID_FILTER
          headers:
            X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
            Cache-Control:
              schema: {type: string, const: no-store}
              description: Errors are never cached (CAT-02b).
          content:
            application/json:
              schema: {$ref: ./common.yaml#/components/schemas/ApiError}
              examples:
                error:
                  value:
                    code: VALIDATION_ERROR
                    message: INVALID_FILTER
                    errors:
                    - {field: q, message: invalid value}
                    metadata: {request_id: cat02a-synthetic-request, trace_id: cat02a-synthetic-trace}
                cursor:
                  value:
                    code: VALIDATION_ERROR
                    message: INVALID_CURSOR
                    errors:
                    - {field: cursor, message: invalid value}
                    metadata: {request_id: cat02a-synthetic-request, trace_id: cat02a-synthetic-trace}
                limit:
                  value:
                    code: VALIDATION_ERROR
                    message: INVALID_LIMIT
                    errors:
                    - {field: limit, message: invalid value}
                    metadata: {request_id: cat02a-synthetic-request, trace_id: cat02a-synthetic-trace}
