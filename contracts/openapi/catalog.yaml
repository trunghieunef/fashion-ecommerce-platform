      headers:
        X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CollectionsResponse'}
          examples:
            success:
              value:
                code: OK
                data:
                  items:
                  - {id: 55555555-5555-4555-8555-555555555555, name_vi: Bộ sưu tập mẫu, name_en: Sample collection, slug: sample-collection, cover_url: null, start_at: null, end_at: null, status: DRAFT, version: 0}
                  page: 1
                  size: 20
                  total: 1
                metadata: {request_id: 11111111-1111-4111-8111-111111111111, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    CreatedCollectionSuccess:
      description: New DRAFT collection with version 0; idempotent retries retain data/status
      headers:
        X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CollectionResponse'}
          examples:
            success:
              value:
                code: OK
                data:
                  id: 55555555-5555-4555-8555-555555555555
                  name_vi: Bộ sưu tập mẫu
                  name_en: Sample collection
                  slug: sample-collection
                  cover_url: null
                  start_at: '2026-10-08T02:00:00Z'
                  end_at: null
                  status: DRAFT
                  version: 0
                  items: [{product_id: 33333333-3333-4333-8333-333333333333, sort_order: 0}]
                metadata: {request_id: 11111111-1111-4111-8111-111111111111, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    CollectionValidationError:
      description: Invalid content, duplicate or missing item products, media fields, time range, or missing key/version
      headers:
        X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
      content:
        application/json:
          schema: {$ref: ./common.yaml#/components/schemas/ApiError}
          examples:
            missingProduct:
              value:
