  /api/v1/catalog/products/{id}:
    get:
      operationId: getProduct
      summary: Get public product detail
      x-implementation-status: implemented
      description: 'CAT-02a implemented. PostgreSQL public products: ACTIVE product, category and its parent if present, brand absent or ACTIVE, at
        least one ACTIVE variant. Money min/max aggregates coalesce(price_override,base_price) over ACTIVE variants. Only AVAILABLE
        images. CAT-02b: Cache-Control public, max-age=5 and Vary Accept-Language; catalog part cached in Redis, stock per variant
        read from the inventory projection on every request. One read-only transaction; sanitized descriptions, locale
        category and size guide; only ACTIVE variants. brand and size_guide can be null; available/observed_at null until observed.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        description: Product UUID; malformed, absent or hidden returns the same 404.
        schema: {type: string, format: uuid}
      - name: Accept-Language
        in: header
        required: false
        description: Starts with en selects en; otherwise vi.
        schema: {type: string}
      responses:
        '200':
          description: CAT-02a implemented response
          headers:
            X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
            Cache-Control:
              schema: {type: string, const: 'public, max-age=5'}
              description: CAT-02b; Redis TTL is separate (04 section 4).
            Vary:
              schema: {type: string, const: Accept-Language}
              description: Size guide locale falls back to Accept-Language.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProductResponse'}
              examples:
                success:
                  value:
                    code: OK
                    data:
                      id: 11111111-1111-4111-8111-111111111111
                      slug: ao-mau
                      name_vi: Áo mẫu
                      name_en: Sample tee
                      description_vi: <p>Áo</p>
                      description_en: ''
                      tags: [new]
                      category: {id: 11111111-1111-4111-8111-111111111111, name: Áo}
                      brand: null
                      min_price: 100000
                      max_price: 120000
                      variants:
                      - {id: 11111111-1111-4111-8111-111111111111, sku: TEE-M, size: M, color: Blue, effective_price: 100000, available: 3,
                        observed_at: '2026-10-17T03:00:00.000Z'}
                      images:
                      - {asset_id: 66666666-6666-4666-8666-666666666666, alt_vi: Áo, alt_en: Shirt, variant_color: null, sort_order: 0}
                      size_guide:
                        category_id: 11111111-1111-4111-8111-111111111111
                        locale: vi
                        guideline_html: ''
                        table:
                          columns: [Size]
                          rows:
                          - [M]
                      available: 3
                      observed_at: '2026-10-17T03:00:00.000Z'
                    metadata: {request_id: cat02a-synthetic-request, trace_id: cat02a-synthetic-trace}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
        '404':
          description: PRODUCT_NOT_FOUND
          headers:
            X-Correlation-Id: {$ref: ./common.yaml#/components/headers/CorrelationId}
            Cache-Control:
              schema: {type: string, const: no-store}
              description: Errors are never cached (CAT-02b).
          content:
            application/json:
              schema: {$ref: ./common.yaml#/components/schemas/ApiError}
              examples:
                error:
                  value:
                    code: NOT_FOUND
                    message: PRODUCT_NOT_FOUND
                    errors: []
                    metadata: {request_id: cat02a-synthetic-request, trace_id: cat02a-synthetic-trace}
