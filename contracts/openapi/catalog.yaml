        columns:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: array
            minItems: 1
            maxItems: 20
            items: {type: string, minLength: 0, maxLength: 100}
