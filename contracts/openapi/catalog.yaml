        schema: {type: string, enum: [DRAFT, ACTIVE, INACTIVE]}
      responses:
        '200': {$ref: '#/components/responses/CollectionsSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
    post:
      operationId: createCollection
      summary: Create a DRAFT collection at version 0
      description: >
        CAT-01b collection mutation implemented. Requires catalog.write.
        Idempotency-Key is mandatory. At most 1000 items; empty collections and unpublished
        products are allowed. Unknown item product_id returns 400 VALIDATION_ERROR with
        field items[i].product_id. Duplicate product_id returns 400. sort_order may tie.
        Timestamps require an ISO-8601 offset and UTC year 1..9999. Convert to UTC and truncate
        to microseconds before comparison, idempotency hash and storage. Null bounds are unbounded;
        when both exist, end_at must be greater than start_at after truncation. cover_url and lookbook fields
        are not accepted; cover_url remains null and validated media belongs to CAT-03.
      security:
      - bearerAuth: []
      parameters:
      - {$ref: ./common.yaml#/components/parameters/IdempotencyKey}
      responses:
        '201': {$ref: '#/components/responses/CreatedCollectionSuccess'}
        '400': {$ref: '#/components/responses/CollectionValidationError'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
        '406': {$ref: '#/components/responses/HttpRequestError'}
        '415': {$ref: '#/components/responses/HttpRequestError'}
