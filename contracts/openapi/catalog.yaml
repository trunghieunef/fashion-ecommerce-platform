    get:
      operationId: "readCatalogImage"
      summary: "Read currently visible attached approved media"
      x-implementation-status: "implemented"
      description: >
        Public attached product ACTIVE, or collection ACTIVE/in [start_at,end_at)/with >=1 ACTIVE product.
        DB visibility decides first (otherwise 404, even with a matching ETag); a matching If-None-Match on a visible image returns 304 without any storage call. A 200 opens the object; a missing object or storage error returns 503.
        Cache-Control is public, max-age=300; an already cached image can remain visible for up to five minutes after unpublish.
        ETag is the immutable approved representation SHA-256. Matching If-None-Match returns 304 without a body.
        Invalid kind returns 400 with field kind. Required storage operations failing return 503 DEPENDENCY_UNAVAILABLE.
        No public browse routes are added.
      security: []
      parameters: [{"$ref":"#/components/parameters/AssetId"},{"$ref":"#/components/parameters/ImageKind"},{"$ref":"#/components/parameters/ImageIfNoneMatch"}]
