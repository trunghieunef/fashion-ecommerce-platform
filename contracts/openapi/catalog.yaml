  /api/v1/catalog/size-guides/{category_id}:
    get:
      operationId: getSizeGuide
      summary: Get localized guide for ACTIVE category
      x-implementation-status: implemented
      description: CAT-02a implemented. Missing guide or non-ACTIVE category returns 404. table is the stored size table, guideline_html
        may be empty.
      security: []
      parameters:
      - name: category_id
        in: path
        required: true
        description: Category UUID; malformed, absent or INACTIVE returns 404.
        schema: {type: string, format: uuid}
      - name: locale
        in: query
        required: false
        description: Explicit locale overrides Accept-Language; otherwise starts with en selects en, default vi.
        schema:
          type: string
          enum: [vi, en]
