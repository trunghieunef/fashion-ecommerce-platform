openapi: 3.1.0
info:
  title: User auth API
  version: 0.1.0
  description: >
    TASK:USR-01a — register, login, refresh and logout (docs/design/03_interfaces.md §2.1).
    Access tokens are ES256 JWTs (iss user-service, aud fashion-api, 900 s). The refresh token
    only travels in the `refresh_token` cookie (HttpOnly; Secure; SameSite=Strict;
    Path=/api/v1/auth; Max-Age 30 days), never in JSON. Cookie POSTs pass the Gateway Origin
    check (ADR-20). TASK:USR-02 part 2a adds `/users/me` and addresses (Bearer access token;
    the account must be ACTIVE and the token's auth_version current). TASK:USR-02 part 2b adds
    `/admin/api/v1/users` (permission user.manage) and the access-token `permissions` claim
    (permission codes of the user's roles, 13 §2). TASK:USR-01 part 1b-i adds password change,
    forgot and reset; the reset token reaches notification only through the internal handoff
    in user-internal.yaml. Rate limits belong to part 1b-ii.
servers:
  - url: http://localhost:8080
    description: Local Gateway
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create a member account and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example: {email: person@example.test, password: Synthetic-pass-1, full_name: Synthetic Person, locale: vi}
      responses:
        '201':
          description: Account created; access token in body, refresh token in Set-Cookie
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
            X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
              example:
                code: OK
                data:
                  user: {id: 88888888-8888-4888-8888-888888888888, email: person@example.test, full_name: Synthetic Person, locale: vi}
                  access_token: eyJhbGciOiJFUzI1NiJ9.synthetic.signature # gitleaks:allow synthetic example token
                  token_type: Bearer
                  expires_in: 900
                metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000011, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: E-mail already registered (compared after trim + lowercase)
          headers:
            X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiError'
                  - properties:
                      code: {const: CONFLICT}
              example:
                code: CONFLICT
                message: EMAIL_ALREADY_REGISTERED
                errors: []
                metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000012, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start a session with e-mail and password
      description: >
        Unknown e-mail, wrong password and a locked account (5 failures → 15 minutes) all return
        the same 401 INVALID_CREDENTIALS so account existence is not revealed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: person@example.test, password: Synthetic-pass-1}
      responses:
        '200':
          description: Session started
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
            X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh cookie and issue a new access token
      description: >
        Each refresh token works once. Reusing a rotated token revokes the whole family (all
        sessions from that login) and returns 401 with a cleared cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: Rotated
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
            X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefreshResponse'}
              example:
                code: OK
                data: {access_token: eyJhbGciOiJFUzI1NiJ9.synthetic.signature, token_type: Bearer, expires_in: 900} # gitleaks:allow synthetic example token
                metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000016, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh-token family and clear the cookie
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '204':
          description: Revoked (also when the cookie is missing or unknown)
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the password; revokes every session including this one
      description: >
        Bumps auth_version and revokes all refresh tokens, then clears the refresh cookie; the
        client signs in again. A wrong current_password is a field error and counts toward the
        five-failure lockout.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '204':
          description: Changed; Set-Cookie clears refresh_token (Max-Age=0)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
  /api/v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a reset e-mail; the answer never reveals whether the account exists
      security: []
      description: >
        For an ACTIVE account, creates a one-time token valid 30 minutes (stored as SHA-256),
        voids earlier unused reset tokens and queues NOTIFY_RESET_PASSWORD with a challenge_id
        only. The handoff store is checked before the account lookup: while it is unavailable
        every well-formed e-mail gets the same 503, so the status never reveals an account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPassword'}
            example: {email: member@example.test}
      responses:
        '202':
          description: Accepted, same body for every well-formed e-mail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForgotAcceptedResponse'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Consume a reset token once and set a new password; revokes every session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordReset'}
      responses:
        '204':
          description: >
            Password replaced; auth_version bumped; refresh tokens revoked; failed-login lock
            cleared. A login that checked the old password before this committed is refused.
        '400':
          description: Invalid input, or a token that is unknown, used, superseded or expired (message INVALID_RESET_TOKEN, field token)
          headers:
            X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiError'
                  - properties:
                      code: {const: VALIDATION_ERROR}
              example:
                code: VALIDATION_ERROR
                message: INVALID_RESET_TOKEN
                errors:
                  - {field: token, message: 'is invalid, used or expired'}
                metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000041, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
  /api/v1/users/me:
    get:
      operationId: getProfile
      summary: Current member profile
      security: [{bearer: []}]
      responses:
        '200':
          description: Profile
          headers:
            X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileResponse'}
              example:
                code: OK
                data: {id: 88888888-8888-4888-8888-888888888888, email: person@example.test, full_name: Synthetic Person, locale: vi, email_verified: false}
                metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000021, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
    put:
      operationId: updateProfile
      summary: Change name and locale only (e-mail, roles and auth_version are ignored)
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
            example: {full_name: New Name, locale: en}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileResponse'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
  /api/v1/users/me/addresses:
    get:
      operationId: listAddresses
      summary: Own addresses, default first
      security: [{bearer: []}]
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [code, data, metadata]
                properties:
                  code: {const: OK}
                  data: {type: array, items: {$ref: '#/components/schemas/Address'}}
                  metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
    post:
      operationId: createAddress
      summary: Add an address; the first one becomes the default
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
            example: {recipient_name: Synthetic Person, phone: '0912345678', province_code: '79', ward_code: '26734', address_line: 1 Synthetic St, is_default: false}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddressResponse'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
  /api/v1/users/me/addresses/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateAddress
      summary: Replace an own address; is_default true moves the default here
      description: Unsetting the current default without choosing another returns 400 DEFAULT_ADDRESS_REQUIRED.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddressResponse'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
        '404':
          $ref: '#/components/responses/AddressNotFound'
    delete:
      operationId: deleteAddress
      summary: Delete an own address; deleting the default promotes the newest remaining one
      security: [{bearer: []}]
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
        '404':
          $ref: '#/components/responses/AddressNotFound'
  /admin/api/v1/users:
    get:
      operationId: listUsers
      summary: Page through accounts with their roles (permission user.manage)
      security: [{bearer: []}]
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: One page, oldest accounts first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPageResponse'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
        '403':
          $ref: '#/components/responses/PermissionRequired'
  /admin/api/v1/users/{id}/roles:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: changeUserRoles
      summary: Replace a user's roles; bumps auth_version and writes an audit row with the reason
      description: >
        Sending the roles the user already has returns 200 without a change (a safe retry).
        An admin cannot change their own roles (403 SELF_MODIFICATION_FORBIDDEN).
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RolesChange'}
            example: {roles: [OPS], reason: Joins warehouse team, expected_version: 0}
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserResponse'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
        '403':
          $ref: '#/components/responses/PermissionRequired'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
  /admin/api/v1/users/{id}/lock:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: lockUser
      summary: Lock an account; revokes its refresh tokens and bumps auth_version, audited
      description: >
        There is no unlock endpoint in Phase 1. The same Idempotency-Key and body return the
        stored response; the same key with another body is 409 CONFLICT IDEMPOTENCY_KEY_REUSED.
        An admin cannot lock themselves (403 SELF_MODIFICATION_FORBIDDEN).
      security: [{bearer: []}]
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LockRequest'}
            example: {reason: Suspicious activity, expected_version: 0}
      responses:
        '200':
          description: The locked user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserResponse'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidAccessToken'
        '403':
          $ref: '#/components/responses/PermissionRequired'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (ES256, ADR-21)
  headers:
    RefreshCookie:
      description: refresh_token=<opaque>; Path=/api/v1/auth; Max-Age=2592000; Secure; HttpOnly; SameSite=Strict (Max-Age=0 clears)
      schema: {type: string}
  parameters:
    RefreshCookie:
      in: cookie
      name: refresh_token
      required: false
      schema: {type: string, minLength: 1}
  responses:
    ValidationError:
      description: Invalid input; errors name each field. Unparseable JSON returns message MALFORMED_JSON; a malformed path parameter returns INVALID_PARAMETER naming it.
      headers:
        X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: VALIDATION_ERROR}
          example:
            code: VALIDATION_ERROR
            message: INVALID_REGISTRATION
            errors:
              - {field: password, message: must be at least 8 characters and at most 72 bytes}
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000013, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    CsrfRejected:
      description: Gateway rejected a cookie-carrying request from a non-allowlisted Origin (ADR-20)
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: FORBIDDEN}
          example:
            code: FORBIDDEN
            message: CSRF_ORIGIN_REJECTED
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000015, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    InvalidAccessToken:
      description: Missing, invalid or stale access token (auth_version changed, account not active)
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: UNAUTHORIZED}
          example:
            code: UNAUTHORIZED
            message: INVALID_ACCESS_TOKEN
            errors: []
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000022, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    AddressNotFound:
      description: Unknown address or another member's address (no existence leak)
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: NOT_FOUND}
          example:
            code: NOT_FOUND
            message: ADDRESS_NOT_FOUND
            errors: []
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000023, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    TemporarilyUnavailable:
      description: A dependency (the secret handoff store) is unavailable; nothing was queued, retry later
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: TEMPORARILY_UNAVAILABLE}
          example:
            code: TEMPORARILY_UNAVAILABLE
            message: DEPENDENCY_UNAVAILABLE
            errors: []
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000042, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    PermissionRequired:
      description: The token lacks the permission, or an admin targets their own account
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: FORBIDDEN}
          example:
            code: FORBIDDEN
            message: PERMISSION_REQUIRED
            errors: []
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000031, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    UserNotFound:
      description: Unknown user id
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: NOT_FOUND}
          example:
            code: NOT_FOUND
            message: USER_NOT_FOUND
            errors: []
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000032, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    VersionConflict:
      description: Stale expected_version (VERSION_CONFLICT) or an Idempotency-Key reused with another body (CONFLICT)
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {enum: [VERSION_CONFLICT, CONFLICT]}
          example:
            code: VERSION_CONFLICT
            message: STALE_VERSION
            errors: []
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000033, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
    Unauthorized:
      description: Generic authentication failure
      headers:
        X-Correlation-Id: {$ref: './common.yaml#/components/headers/CorrelationId'}
      content:
        application/json:
          schema:
            allOf:
              - $ref: './common.yaml#/components/schemas/ApiError'
              - properties:
                  code: {const: UNAUTHORIZED}
          example:
            code: UNAUTHORIZED
            message: INVALID_CREDENTIALS
            errors: []
            metadata: {request_id: 4c8a1f2e-0000-4000-8000-000000000014, trace_id: 4bf92f3577b34da6a3ce929d0e0e4736}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, full_name, locale]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, description: At most 72 UTF-8 bytes (BCrypt)}
        full_name: {type: string, minLength: 1, maxLength: 200}
        locale: {enum: [vi, en]}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}
    User:
      type: object
      required: [id, email, full_name, locale]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        full_name: {type: string}
        locale: {enum: [vi, en]}
    Session:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        user: {$ref: '#/components/schemas/User'}
        access_token: {type: string, minLength: 1}
        token_type: {const: Bearer}
        expires_in: {const: 900}
    SessionResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {const: OK}
        data:
          allOf:
            - $ref: '#/components/schemas/Session'
            - required: [user]
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    RefreshTokens:
      description: Refresh only rotates tokens; it never returns the profile
      type: object
      required: [access_token, token_type, expires_in]
      additionalProperties: false
      properties:
        access_token: {type: string, minLength: 1}
        token_type: {const: Bearer}
        expires_in: {const: 900}
    RefreshResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {const: OK}
        data: {$ref: '#/components/schemas/RefreshTokens'}
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    Profile:
      type: object
      required: [id, email, full_name, locale, email_verified]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        full_name: {type: string}
        locale: {enum: [vi, en]}
        email_verified: {type: boolean}
    ProfileUpdate:
      type: object
      required: [full_name, locale]
      properties:
        full_name: {type: string, minLength: 1, maxLength: 200}
        locale: {enum: [vi, en]}
    ProfileResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {const: OK}
        data: {$ref: '#/components/schemas/Profile'}
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    AddressInput:
      type: object
      required: [recipient_name, phone, province_code, ward_code, address_line]
      properties:
        recipient_name: {type: string, minLength: 1, maxLength: 100}
        phone: {type: string, pattern: '^(0|\+84)\d{9}$'}
        province_code: {type: string, minLength: 1, maxLength: 10}
        district_code: {type: [string, 'null'], maxLength: 10}
        ward_code: {type: string, minLength: 1, maxLength: 10}
        address_line: {type: string, minLength: 1, maxLength: 255}
        is_default: {type: boolean, default: false}
    Address:
      type: object
      required: [id, recipient_name, phone, province_code, district_code, ward_code, address_line, is_default]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        recipient_name: {type: string}
        phone: {type: string}
        province_code: {type: string}
        district_code: {type: [string, 'null']}
        ward_code: {type: string}
        address_line: {type: string}
        is_default: {type: boolean}
    AddressResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {const: OK}
        data: {$ref: '#/components/schemas/Address'}
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    RolesChange:
      allOf:
        - $ref: './common.yaml#/components/schemas/ExpectedVersion'
        - type: object
          required: [roles, reason]
          properties:
            roles:
              type: array
              uniqueItems: true
              items: {enum: [SUPER_ADMIN, OPS, FINANCE, MARKETING]}
            reason: {type: string, minLength: 1, maxLength: 500}
    LockRequest:
      allOf:
        - $ref: './common.yaml#/components/schemas/ExpectedVersion'
        - type: object
          required: [reason]
          properties:
            reason: {type: string, minLength: 1, maxLength: 500}
    AdminUser:
      description: version is auth_version; send it back as expected_version
      type: object
      required: [id, email, full_name, status, roles, version, created_at]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        email: {type: [string, 'null']}
        full_name: {type: string}
        status: {enum: [ACTIVE, LOCKED, INACTIVE]}
        roles:
          type: array
          items: {enum: [SUPER_ADMIN, OPS, FINANCE, MARKETING]}
        version: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
    AdminUserResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {const: OK}
        data: {$ref: '#/components/schemas/AdminUser'}
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    AdminUserPageResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {const: OK}
        data:
          type: object
          required: [items, page, size, total]
          additionalProperties: false
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/AdminUser'}
            page: {type: integer, minimum: 1}
            size: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1}
        new_password: {type: string, minLength: 8, description: At most 72 UTF-8 bytes (BCrypt)}
    ForgotPassword:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    ForgotAcceptedResponse:
      type: object
      required: [code, data, metadata]
      properties:
        code: {const: OK}
        data:
          type: object
          required: [message]
          additionalProperties: false
          properties:
            message: {const: RESET_EMAIL_REQUESTED}
        metadata: {$ref: './common.yaml#/components/schemas/Metadata'}
    PasswordReset:
      type: object
      required: [token, new_password]
      properties:
        token: {type: string, minLength: 1, maxLength: 128}
        new_password: {type: string, minLength: 8, description: At most 72 UTF-8 bytes (BCrypt)}
