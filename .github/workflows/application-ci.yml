name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: no AWS/registry credentials, no deploy. S1-local proof only.
permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s1-local:
    name: s1-local
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Full history so the secret scan covers every commit, not only the tip.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tool-versions
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Verify toolchain and lockfiles
        run: bash scripts/verify-toolchain.sh
      - name: Secret scan (gitleaks, pinned digest)
        run: bash scripts/scan-secrets.sh
      - name: Documentation checks
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -B scripts/check_docs.py
      - name: Backend tests (PostgreSQL via Testcontainers)
        run: ./mvnw -B test
      - name: Frontend typecheck, unit tests, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Contract validation
        run: |
          python3 -m venv /tmp/fashion-contracts-venv
          source /tmp/fashion-contracts-venv/bin/activate
          python3 -m pip install -r tests/contracts/requirements.txt
          bash scripts/validate-contracts.sh
      - name: Start local stack
        run: bash scripts/local-up.sh
      - name: Local smoke
        run: bash scripts/smoke-local.sh
      - name: Browser smoke
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file infra/local/.env -f infra/local/compose.yaml logs --no-color
