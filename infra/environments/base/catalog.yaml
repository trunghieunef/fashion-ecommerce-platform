apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: catalog
          image: catalog-service
          ports:
            - {name: http, containerPort: 8081}
          env:
            - {name: CATALOG_DB_URL, value: "jdbc:postgresql://postgres:5432/catalog"}
            - {name: CATALOG_DB_USERNAME, value: catalog_runtime}
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: catalog-db-runtime, key: password}
            - {name: CATALOG_MIGRATION_DB_URL, value: "jdbc:postgresql://postgres:5432/catalog"}
            - {name: CATALOG_MIGRATION_DB_USERNAME, value: catalog_migration}
            - name: CATALOG_MIGRATION_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: catalog-db-migration, key: password}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75 -Duser.timezone=UTC"}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector: {app: catalog}
  ports:
    - {name: http, port: 8081, targetPort: http}
