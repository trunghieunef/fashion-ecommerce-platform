services:
  # TASK:INV-01: local-only combined KRaft node. No auth; only the host listener is loopback-published.
  kafka:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # gitleaks:allow local cluster identity, not a credential
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka-init:/opt/fashion-kafka-init:ro
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: ${CATALOG_POSTGRES_DB:-catalog}
      POSTGRES_USER: ${CATALOG_POSTGRES_ADMIN_USERNAME:-catalog_admin}
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_ADMIN_PASSWORD:?set CATALOG_POSTGRES_ADMIN_PASSWORD}
      CATALOG_MIGRATION_DB_PASSWORD: ${CATALOG_MIGRATION_DB_PASSWORD:?set CATALOG_MIGRATION_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}
      USER_MIGRATION_DB_PASSWORD: ${USER_MIGRATION_DB_PASSWORD:?set USER_MIGRATION_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
      INVENTORY_MIGRATION_DB_PASSWORD: ${INVENTORY_MIGRATION_DB_PASSWORD:?run scripts/local-up.sh}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?run scripts/local-up.sh}
      CART_MIGRATION_DB_PASSWORD: ${CART_MIGRATION_DB_PASSWORD:?run scripts/local-up.sh}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?run scripts/local-up.sh}
    ports:
      - "127.0.0.1:${CATALOG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
      - ./postgres-init/01-catalog-roles.sh:/docker-entrypoint-initdb.d/01-catalog-roles.sh:ro
      - ./postgres-init/02-user-db.sh:/docker-entrypoint-initdb.d/02-user-db.sh:ro
      - ./postgres-init/03-inventory-db.sh:/docker-entrypoint-initdb.d/03-inventory-db.sh:ro
      - ./postgres-init/04-cart-db.sh:/docker-entrypoint-initdb.d/04-cart-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TASK:USR-01b: short-lived encrypted secrets (and rate limits in 1b-ii). Private, password
  # protected, no persistence: PostgreSQL stays the source of truth. License: see 17 (open item).
  redis:
    image: redis:8.2.9@sha256:66b7f4c2f3c6ef1b298bbd7b13c806bc6f71e61f1136a4f58710daf2cb053b21
    environment:
      REDISCLI_AUTH: ${USER_REDIS_PASSWORD:?set USER_REDIS_PASSWORD}
      # TASK:CAT-02b: catalog has its own ACL user limited to its key prefix (spec section 2).
      CATALOG_REDIS_PASSWORD: ${CATALOG_REDIS_PASSWORD:?run scripts/local-up.sh to generate CATALOG_REDIS_PASSWORD}
      FASHION_ENV: ${FASHION_ENV:-local}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --save '' --appendonly no --user catalog on \">$$CATALOG_REDIS_PASSWORD\" \"~$${FASHION_ENV}:catalog:*\" +@connection -@dangerous +get +set +incr"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TASK:CAT-03: local-only S3-compatible store (Apache-2.0). Loopback port only, console disabled;
  # never use this image or these credentials in staging/production (16 provisions S3 separately).
  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${CATALOG_S3_ACCESS_KEY:?run scripts/local-up.sh to generate CATALOG_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${CATALOG_S3_SECRET_KEY:?run scripts/local-up.sh to generate CATALOG_S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - catalog-media-data:/data

  # Only with --profile nacos-compat (O02 compatibility proof). No published ports.
  nacos:
    image: nacos/nacos-server:v3.2.4@sha256:1c191c30c8cd5ff2a72bf576555dbaa57a616378c55168651a74aefadedf7708
    profiles: [nacos-compat]
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set NACOS_AUTH_IDENTITY_VALUE}
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v3/admin/core/state/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40

  # Images copy host-built artifacts (target/*.jar, web/storefront/dist). Start with
  # scripts/local-up.sh; a bare `docker compose up --build` packages whatever artifact is on disk.

  # Private: no published port; reachable only through the Gateway.
  catalog:
    build: ../../services/catalog-service
    environment:
      # TASK:PLT-05: traces to local Tempo; sampling 1.0 only here.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/${CATALOG_POSTGRES_DB:-catalog}
      CATALOG_JWT_PUBLIC_KEYS: ${USER_JWT_PUBLIC_KEYS:?run scripts/local-up.sh to generate local JWT keys}
      CATALOG_INTERNAL_CALLERS: ${CATALOG_INTERNAL_CALLERS:-}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-catalog_runtime}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}
      CATALOG_MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/${CATALOG_POSTGRES_DB:-catalog}
      CATALOG_MIGRATION_DB_USERNAME: ${CATALOG_MIGRATION_DB_USERNAME:-catalog_migration}
      CATALOG_MIGRATION_DB_PASSWORD: ${CATALOG_MIGRATION_DB_PASSWORD:?set CATALOG_MIGRATION_DB_PASSWORD}
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PUBLIC_ENDPOINT: ${CATALOG_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:19000}
      CATALOG_S3_REGION: ${CATALOG_S3_REGION:-us-east-1}
      CATALOG_S3_ACCESS_KEY: ${CATALOG_S3_ACCESS_KEY:?run scripts/local-up.sh to generate CATALOG_S3_ACCESS_KEY}
      CATALOG_S3_SECRET_KEY: ${CATALOG_S3_SECRET_KEY:?run scripts/local-up.sh to generate CATALOG_S3_SECRET_KEY}
      CATALOG_S3_QUARANTINE_RETENTION_DAYS: ${CATALOG_S3_QUARANTINE_RETENTION_DAYS:-2}
      CATALOG_S3_BOOTSTRAP_BUCKET: "true"
      CATALOG_S3_CORS_ORIGINS: http://localhost:${STOREFRONT_PORT:-4173}
      CATALOG_REDIS_HOST: redis
      CATALOG_REDIS_PASSWORD: ${CATALOG_REDIS_PASSWORD:?run scripts/local-up.sh to generate CATALOG_REDIS_PASSWORD}
      FASHION_ENV: ${FASHION_ENV:-local}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Readiness of catalog does not depend on S3; bootstrap retries 10 x 1s.
      rustfs:
        condition: service_started
      # Cache only: catalog serves from PostgreSQL while Redis is down.
      redis:
        condition: service_started
      nacos:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  inventory:
    build: ../../services/inventory-service
    environment:
      # TASK:PLT-05: traces to local Tempo; sampling 1.0 only here.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?run scripts/local-up.sh}
      INVENTORY_MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/inventory
      INVENTORY_MIGRATION_DB_PASSWORD: ${INVENTORY_MIGRATION_DB_PASSWORD:?run scripts/local-up.sh}
      INVENTORY_JWT_PUBLIC_KEYS: ${USER_JWT_PUBLIC_KEYS:?run scripts/local-up.sh}
      INVENTORY_INTERNAL_CALLERS: ${INVENTORY_INTERNAL_CALLERS:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  # TASK:USR-01a. Private: no published port; reachable only through the Gateway.
  # TASK:CART-01: guest/member carts; private like other services, reachable through the Gateway.
  cart:
    build: ../../services/cart-service
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      CART_DB_URL: jdbc:postgresql://postgres:5432/cart
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?run scripts/local-up.sh}
      CART_MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/cart
      CART_MIGRATION_DB_PASSWORD: ${CART_MIGRATION_DB_PASSWORD:?run scripts/local-up.sh}
      CART_JWT_PUBLIC_KEYS: ${USER_JWT_PUBLIC_KEYS:?run scripts/local-up.sh}
      CART_SERVICE_PRIVATE_KEY: ${CART_SERVICE_PRIVATE_KEY:-}
      CART_SERVICE_PUBLIC_KEY: ${CART_SERVICE_PUBLIC_KEY:-}
      CART_CATALOG_URL: http://catalog:8081
      CART_INVENTORY_URL: http://inventory:8083
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  user-service:
    build: ../../services/user-service
    environment:
      # TASK:PLT-05: traces to local Tempo; sampling 1.0 only here.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      FASHION_ENV: ${FASHION_ENV:-local}
      USER_DB_URL: jdbc:postgresql://postgres:5432/users
      USER_DB_USERNAME: user_runtime
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
      USER_MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/users
      USER_MIGRATION_DB_USERNAME: user_migration
      USER_MIGRATION_DB_PASSWORD: ${USER_MIGRATION_DB_PASSWORD:?set USER_MIGRATION_DB_PASSWORD}
      USER_JWT_PRIVATE_KEY: ${USER_JWT_PRIVATE_KEY:?run scripts/local-up.sh to generate USER_JWT_PRIVATE_KEY}
      USER_JWT_KEY_ID: ${USER_JWT_KEY_ID:-user-local}
      USER_JWT_PUBLIC_KEYS: ${USER_JWT_PUBLIC_KEYS:?run scripts/local-up.sh to derive USER_JWT_PUBLIC_KEYS}
      USER_BOOTSTRAP_ADMIN_EMAIL: ${USER_BOOTSTRAP_ADMIN_EMAIL:-}
      USER_REDIS_HOST: redis
      USER_REDIS_PASSWORD: ${USER_REDIS_PASSWORD:?set USER_REDIS_PASSWORD}
      USER_SECRET_KEY: ${USER_SECRET_KEY:?run scripts/local-up.sh to generate USER_SECRET_KEY}
      USER_INTERNAL_CALLERS: ${USER_INTERNAL_CALLERS:-}
      USER_TRUSTED_GATEWAYS: gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    build: ../../services/gateway
    environment:
      # TASK:PLT-05: traces to local Tempo; sampling 1.0 only here.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      INVENTORY_BASE_URL: http://inventory:8083
      CART_BASE_URL: http://cart:8084
      # nacos-compat proof sets GATEWAY_CATALOG_BASE_URL=lb://catalog-service.
      CATALOG_BASE_URL: ${GATEWAY_CATALOG_BASE_URL:-http://catalog:8081}
      USER_BASE_URL: http://user-service:8082
      GATEWAY_TRUSTED_PROXIES: storefront
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      catalog:
        condition: service_healthy
      user-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
        required: false
    healthcheck:
      # Management port 9080 is container-internal only (not published).
      test: ["CMD", "curl", "-fsS", "http://localhost:9080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  storefront:
    build: ../../web/storefront
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-4173}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TASK:PLT-05: local-only trace store (Tempo 3 monolithic) and viewer. Loopback ports only; services
  # do not wait for them, so a stopped Tempo only drops spans.
  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Explore (trace search) needs this for the anonymous viewer; nothing is persisted.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      tempo:
        condition: service_started

volumes:
  kafka-data:
  catalog-postgres-data:
  catalog-media-data:
  nacos-data:
  tempo-data:
