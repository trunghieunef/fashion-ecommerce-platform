services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: ${CATALOG_POSTGRES_DB:-catalog}
      POSTGRES_USER: ${CATALOG_POSTGRES_ADMIN_USERNAME:-catalog_admin}
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_ADMIN_PASSWORD:?set CATALOG_POSTGRES_ADMIN_PASSWORD}
      CATALOG_MIGRATION_DB_PASSWORD: ${CATALOG_MIGRATION_DB_PASSWORD:?set CATALOG_MIGRATION_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}
      USER_MIGRATION_DB_PASSWORD: ${USER_MIGRATION_DB_PASSWORD:?set USER_MIGRATION_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
    ports:
      - "127.0.0.1:${CATALOG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
      - ./postgres-init/01-catalog-roles.sh:/docker-entrypoint-initdb.d/01-catalog-roles.sh:ro
      - ./postgres-init/02-user-db.sh:/docker-entrypoint-initdb.d/02-user-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TASK:USR-01b: short-lived encrypted secrets (and rate limits in 1b-ii). Private, password
  # protected, no persistence: PostgreSQL stays the source of truth. License: see 17 (open item).
  redis:
    image: redis:8.2.9@sha256:66b7f4c2f3c6ef1b298bbd7b13c806bc6f71e61f1136a4f58710daf2cb053b21
    environment:
      REDISCLI_AUTH: ${USER_REDIS_PASSWORD:?set USER_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Only with --profile nacos-compat (O02 compatibility proof). No published ports.
  nacos:
    image: nacos/nacos-server:v3.2.4@sha256:1c191c30c8cd5ff2a72bf576555dbaa57a616378c55168651a74aefadedf7708
    profiles: [nacos-compat]
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set NACOS_AUTH_IDENTITY_VALUE}
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v3/admin/core/state/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40

  # Images copy host-built artifacts (target/*.jar, web/storefront/dist). Start with
  # scripts/local-up.sh; a bare `docker compose up --build` packages whatever artifact is on disk.

  # Private: no published port; reachable only through the Gateway.
  catalog:
    build: ../../services/catalog-service
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/${CATALOG_POSTGRES_DB:-catalog}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-catalog_runtime}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}
      CATALOG_MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/${CATALOG_POSTGRES_DB:-catalog}
      CATALOG_MIGRATION_DB_USERNAME: ${CATALOG_MIGRATION_DB_USERNAME:-catalog_migration}
      CATALOG_MIGRATION_DB_PASSWORD: ${CATALOG_MIGRATION_DB_PASSWORD:?set CATALOG_MIGRATION_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  # TASK:USR-01a. Private: no published port; reachable only through the Gateway.
  user-service:
    build: ../../services/user-service
    environment:
      USER_DB_URL: jdbc:postgresql://postgres:5432/users
      USER_DB_USERNAME: user_runtime
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
      USER_MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/users
      USER_MIGRATION_DB_USERNAME: user_migration
      USER_MIGRATION_DB_PASSWORD: ${USER_MIGRATION_DB_PASSWORD:?set USER_MIGRATION_DB_PASSWORD}
      USER_JWT_PRIVATE_KEY: ${USER_JWT_PRIVATE_KEY:?run scripts/local-up.sh to generate USER_JWT_PRIVATE_KEY}
      USER_JWT_KEY_ID: ${USER_JWT_KEY_ID:-user-local}
      USER_JWT_PUBLIC_KEYS: ${USER_JWT_PUBLIC_KEYS:?run scripts/local-up.sh to derive USER_JWT_PUBLIC_KEYS}
      USER_BOOTSTRAP_ADMIN_EMAIL: ${USER_BOOTSTRAP_ADMIN_EMAIL:-}
      USER_REDIS_HOST: redis
      USER_REDIS_PASSWORD: ${USER_REDIS_PASSWORD:?set USER_REDIS_PASSWORD}
      USER_SECRET_KEY: ${USER_SECRET_KEY:?run scripts/local-up.sh to generate USER_SECRET_KEY}
      USER_INTERNAL_CALLERS: ${USER_INTERNAL_CALLERS:-}
      USER_TRUSTED_GATEWAYS: gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    build: ../../services/gateway
    environment:
      # nacos-compat proof sets GATEWAY_CATALOG_BASE_URL=lb://catalog-service.
      CATALOG_BASE_URL: ${GATEWAY_CATALOG_BASE_URL:-http://catalog:8081}
      USER_BASE_URL: http://user-service:8082
      GATEWAY_TRUSTED_PROXIES: storefront
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      catalog:
        condition: service_healthy
      user-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
        required: false
    healthcheck:
      # Management port 9080 is container-internal only (not published).
      test: ["CMD", "curl", "-fsS", "http://localhost:9080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  storefront:
    build: ../../web/storefront
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-4173}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  catalog-postgres-data:
  nacos-data:
