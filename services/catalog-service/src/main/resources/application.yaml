server:
  port: ${SERVER_PORT:8081}

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  task:
    scheduling:
      pool:
        size: 2 # media GC (hourly, slow S3) must not block the 60s quarantine sweep
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
      accept-float-as-int: false
  application:
    name: catalog-service
  data:
    redis:
      # CAT-02b: cache only; any Redis error falls back to PostgreSQL inside the request.
      host: ${CATALOG_REDIS_HOST:localhost}
      port: ${CATALOG_REDIS_PORT:6379}
      username: ${CATALOG_REDIS_USERNAME:catalog}
      password: ${CATALOG_REDIS_PASSWORD:}
      connect-timeout: 200ms
      timeout: 200ms
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USERNAME:catalog_runtime}
    password: ${CATALOG_DB_PASSWORD:catalog_runtime_local}
    hikari:
      maximum-pool-size: ${CATALOG_DB_MAX_POOL_SIZE:10}
  cloud:
    # Nacos is off by default; profile nacos-compat enables it (O02 proof).
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  flyway:
    url: ${CATALOG_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    user: ${CATALOG_MIGRATION_DB_USERNAME:catalog_migration}
    password: ${CATALOG_MIGRATION_DB_PASSWORD:catalog_migration_local}
    locations: classpath:db/migration

logging:
  structured:
    format:
      # PLT-05: JSON (ECS) logs with trace ids; every string value is redacted (XCT-06).
      console: ecs
    json:
      customizer: vn.fashion.platform.security.PiiRedactingJsonCustomizer

fashion:
  messaging:
    relay:
      enabled: ${CATALOG_RELAY_ENABLED:true}
  catalog:
    cache:
      enabled: ${CATALOG_CACHE_ENABLED:true}
      environment: ${FASHION_ENV:local}
    internal-callers: ${CATALOG_INTERNAL_CALLERS:}
    jwt:
      public-keys: ${CATALOG_JWT_PUBLIC_KEYS}
    media:
      bucket: ${CATALOG_S3_BUCKET:catalog-media-local}
      endpoint: ${CATALOG_S3_ENDPOINT}
      public-endpoint: ${CATALOG_S3_PUBLIC_ENDPOINT:${CATALOG_S3_ENDPOINT}}
      region: ${CATALOG_S3_REGION:us-east-1}
      access-key: ${CATALOG_S3_ACCESS_KEY}
      secret-key: ${CATALOG_S3_SECRET_KEY}
      cors-origins: ${CATALOG_S3_CORS_ORIGINS:http://localhost:4173}
      quarantine-retention-days: ${CATALOG_S3_QUARANTINE_RETENTION_DAYS:2}
      bootstrap-bucket: ${CATALOG_S3_BOOTSTRAP_BUCKET:false}
      jobs-enabled: ${CATALOG_MEDIA_JOBS_ENABLED:true}
      s3-timeout: 10s

management:
  # PLT-05: no OTLP endpoint here on purpose: an empty value still creates the exporter. Traces leave
  # the process only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (local compose: Tempo).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  observations:
    enable:
      # Scheduler runs (relay, sweeps, cache worker, media jobs) are not requests: no trace per run, and
      # outbox rows they write keep trace_parent null (PLT-05 spec section 3).
      tasks.scheduled: false
  health:
    # Readiness must not depend on the cache (CAT-02b spec section 2).
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,catalogMigration
