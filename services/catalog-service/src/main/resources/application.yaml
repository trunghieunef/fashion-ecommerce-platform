server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USERNAME:catalog_runtime}
    password: ${CATALOG_DB_PASSWORD:catalog_runtime_local}
    hikari:
      maximum-pool-size: ${CATALOG_DB_MAX_POOL_SIZE:10}
  cloud:
    # Nacos is off by default; profile nacos-compat enables it (O02 proof).
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  flyway:
    url: ${CATALOG_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    user: ${CATALOG_MIGRATION_DB_USERNAME:catalog_migration}
    password: ${CATALOG_MIGRATION_DB_PASSWORD:catalog_migration_local}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,catalogMigration
