server:
  port: ${SERVER_PORT:8086}

spring:
  kafka:
    consumer:
      group-id: payment-service
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
      accept-float-as-int: false
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${PAYMENT_DB_USERNAME:payment_runtime}
    password: ${PAYMENT_DB_PASSWORD:payment_runtime_local}
    hikari:
      maximum-pool-size: ${PAYMENT_DB_MAX_POOL_SIZE:10}
  cloud:
    # Nacos is off by default; profile nacos-compat enables it (O02 proof).
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  flyway:
    url: ${PAYMENT_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/payment}
    user: ${PAYMENT_MIGRATION_DB_USERNAME:payment_migration}
    password: ${PAYMENT_MIGRATION_DB_PASSWORD:payment_migration_local}
    locations: classpath:db/migration

logging:
  structured:
    format:
      # PLT-05: JSON (ECS) logs with trace ids; every string value is redacted (XCT-06).
      console: ecs
    json:
      customizer: vn.fashion.platform.security.PiiRedactingJsonCustomizer

fashion:
  messaging:
    relay:
      enabled: ${PAYMENT_RELAY_ENABLED:true}
  payment:
    jwt:
      public-keys: ${PAYMENT_JWT_PUBLIC_KEYS}
    # ADR-19: callers allowed on /internal (order-service only); empty = every internal call 401.
    internal-callers: ${PAYMENT_INTERNAL_CALLERS:}
    # COD evidence for an order without a payment is retried this long (from the event time), then sent to the DLT.
    cod-orphan-grace: ${PAYMENT_COD_ORPHAN_GRACE:10m}
    # TASK:PAY-02: empty tmn-code or hash-secret = VNPAY disabled. The secret comes from env only.
    vnpay:
      tmn-code: ${PAYMENT_VNPAY_TMN_CODE:}
      hash-secret: ${PAYMENT_VNPAY_HASH_SECRET:}
      pay-url: ${PAYMENT_VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      api-url: ${PAYMENT_VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      return-url: ${PAYMENT_VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
      storefront-url: ${PAYMENT_STOREFRONT_URL:http://localhost:5173}
      link-ttl: ${PAYMENT_VNPAY_LINK_TTL:15m}
      server-ip: ${PAYMENT_VNPAY_SERVER_IP:127.0.0.1}
      query-timeout: ${PAYMENT_VNPAY_QUERY_TIMEOUT:10s}

management:
  # PLT-05: no OTLP endpoint here on purpose: an empty value still creates the exporter. Traces leave
  # the process only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (local compose: Tempo).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  observations:
    enable:
      tasks.scheduled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
