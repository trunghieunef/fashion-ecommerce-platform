server:
  port: ${SERVER_PORT:8085}

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  task:
    scheduling:
      pool:
        size: 1
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
      accept-float-as-int: false
  application:
    name: shipping-service
  datasource:
    url: ${SHIPPING_DB_URL:jdbc:postgresql://localhost:5432/shipping}
    username: ${SHIPPING_DB_USERNAME:shipping_runtime}
    password: ${SHIPPING_DB_PASSWORD:shipping_runtime_local}
    hikari:
      maximum-pool-size: ${SHIPPING_DB_MAX_POOL_SIZE:10}
  cloud:
    # Nacos is off by default; profile nacos-compat enables it (O02 proof).
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  flyway:
    url: ${SHIPPING_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/shipping}
    user: ${SHIPPING_MIGRATION_DB_USERNAME:shipping_migration}
    password: ${SHIPPING_MIGRATION_DB_PASSWORD:shipping_migration_local}
    locations: classpath:db/migration

logging:
  structured:
    format:
      # PLT-05: JSON (ECS) logs with trace ids; every string value is redacted (XCT-06).
      console: ecs
    json:
      customizer: vn.fashion.platform.security.PiiRedactingJsonCustomizer

fashion:
  messaging:
    relay:
      enabled: ${SHIPPING_RELAY_ENABLED:true}
  shipping:
    jwt:
      public-keys: ${SHIPPING_JWT_PUBLIC_KEYS}
    # ADR-19: callers allowed on /internal (order-service only); empty = every internal call 401.
    internal-callers: ${SHIPPING_INTERNAL_CALLERS:}
    # Caller identity shipping-service for catalog quote (weights); local-up generates the pair.
    service-private-key: ${SHIPPING_SERVICE_PRIVATE_KEY:}
    service-public-key: ${SHIPPING_SERVICE_PUBLIC_KEY:}
    catalog-url: ${SHIPPING_CATALOG_URL:http://localhost:8081}
    dependency-timeout: ${SHIPPING_DEPENDENCY_TIMEOUT:1s}
    estimate-ttl: ${SHIPPING_ESTIMATE_TTL:1h}
    quote-ttl: ${SHIPPING_QUOTE_TTL:15m}
    # Warehouse the SELF shipper picks up from; local placeholder only (O04).
    from-address: ${SHIPPING_FROM_ADDRESS:{"name":"Kho mẫu","province_code":"79","address_line":"Địa chỉ kho mẫu"}}

management:
  # PLT-05: no OTLP endpoint here on purpose: an empty value still creates the exporter. Traces leave
  # the process only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (local compose: Tempo).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  observations:
    enable:
      tasks.scheduled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
