server:
  port: ${GATEWAY_PORT:8080}
  forward-headers-strategy: none

spring:
  application:
    name: gateway
  cloud:
    # Nacos discovery is off by default; profile nacos-compat enables it (O02 proof).
    nacos:
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 500
            response-timeout: 2s
          routes:
            # CAT-03: S3 can take 10s to return an error; preserve the service's 503.
            - id: catalog-public-media-read
              uri: ${CATALOG_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/catalog/images/*
                - Method=GET
              metadata:
                response-timeout: 30000
            - id: catalog-public
              uri: ${CATALOG_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/catalog/**
            # CAT-03: complete downloads and re-encodes the image; 30s instead of the global 2s.
            - id: catalog-admin-media-complete
              uri: ${CATALOG_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/admin/api/v1/catalog/images/uploads/*/complete
              metadata:
                response-timeout: 30000
            - id: catalog-admin-media-read
              uri: ${CATALOG_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/admin/api/v1/catalog/images/*
                - Method=GET
              metadata:
                response-timeout: 30000
            - id: catalog-admin
              uri: ${CATALOG_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/admin/api/v1/catalog/**
            - id: inventory-import
              uri: ${INVENTORY_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/admin/api/v1/inventory/import
                - Method=POST
              metadata:
                response-timeout: 30000
            - id: inventory-admin
              uri: ${INVENTORY_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/admin/api/v1/inventory/**
            # TASK:CART-01: guest cookie / member Bearer carts; cart-service checks ownership.
            - id: cart-public
              uri: ${CART_BASE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/carts/**,/api/v1/carts
            # TASK:SHP-01: public fee estimate and OPS shipping admin; shipping-service checks permissions.
            - id: shipping-public
              uri: ${SHIPPING_BASE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/shipping/**
            - id: shipping-admin
              uri: ${SHIPPING_BASE_URL:http://localhost:8085}
              predicates:
                - Path=/admin/api/v1/shipping/**
            # TASK:PAY-02: VNPay IPN (server-to-server, signature checked by payment-service) and browser return only;
            # every other /api/v1/payments path stays 404.
            - id: payment-vnpay-public
              uri: ${PAYMENT_BASE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/payments/vnpay/ipn,/api/v1/payments/vnpay/return
            # TASK:PAY-01: FINANCE payments admin; payment-service checks permissions.
            - id: payment-admin
              uri: ${PAYMENT_BASE_URL:http://localhost:8086}
              predicates:
                - Path=/admin/api/v1/payments/**
            # TASK:ORD-03: OPS/FINANCE orders (list, detail, confirm-cod, cancel); order-service checks permissions.
            - id: order-admin
              uri: ${ORDER_BASE_URL:http://localhost:8087}
              predicates:
                - Path=/admin/api/v1/orders/**,/admin/api/v1/orders
            # TASK:ORD-01: quote, create and read for members (Bearer) and guests (checkout token / order cookie).
            - id: order-public
              uri: ${ORDER_BASE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/orders
            - id: user-auth-public
              uri: ${USER_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-profile-public
              uri: ${USER_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**
            # Admin user management (USR-02b); user-service checks the user.manage permission.
            - id: user-admin
              uri: ${USER_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/admin/api/v1/users,/admin/api/v1/users/**

logging:
  structured:
    format:
      # PLT-05: JSON (ECS) logs with trace ids; every string value is redacted (XCT-06).
      console: ecs
    json:
      customizer: vn.fashion.platform.security.PiiRedactingJsonCustomizer

fashion:
  security:
    # ADR-20: browser origins allowed for cookie-authenticated mutations; empty = reject all.
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:4173}
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

management:
  # PLT-05: no OTLP endpoint here on purpose: an empty value still creates the exporter. Traces leave
  # the process only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (local compose: Tempo).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  observations:
    enable:
      # Scheduler runs (relay, sweeps, cache worker, media jobs) are not requests: no trace per run, and
      # outbox rows they write keep trace_parent null (PLT-05 spec section 3).
      tasks.scheduled: false
  # Actuator on its own port, never published or routed (SEC-01, before PLT-04).
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
