server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    # Nacos discovery is off by default; profile nacos-compat enables it (O02 proof).
    nacos:
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 500
            response-timeout: 2s
          routes:
            - id: catalog-public
              uri: ${CATALOG_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/catalog/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
