server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: none

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${USER_DB_USERNAME:user_runtime}
    password: ${USER_DB_PASSWORD:user_runtime_local}
    hikari:
      maximum-pool-size: ${USER_DB_MAX_POOL_SIZE:10}
  flyway:
    url: ${USER_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/users}
    user: ${USER_MIGRATION_DB_USERNAME:user_migration}
    password: ${USER_MIGRATION_DB_PASSWORD:user_migration_local}
    locations: classpath:db/migration
  data:
    redis:
      # USR-01b: auth quotas and encrypted ephemeral secrets; PostgreSQL owns business data.
      host: ${USER_REDIS_HOST:localhost}
      port: ${USER_REDIS_PORT:6379}
      password: ${USER_REDIS_PASSWORD:}
      # Leave margin for the public Gateway's 2s response budget, including first connection.
      connect-timeout: 500ms
      timeout: 500ms
  jackson:
    # JSON names are snake_case (03 section 1.1).
    property-naming-strategy: SNAKE_CASE

fashion:
  environment: ${FASHION_ENV:local}
  user:
    jwt:
      # Base64 PKCS#8 EC P-256 private key; no default so the service fails closed without it.
      private-key: ${USER_JWT_PRIVATE_KEY}
      key-id: ${USER_JWT_KEY_ID:user-local}
      # ADR-21 verifier keys: kid:base64-X.509 entries, comma separated (two during rotation).
      public-keys: ${USER_JWT_PUBLIC_KEYS}
    # Email of an already registered account to make the first SUPER_ADMIN; ignored once one exists.
    bootstrap-admin-email: ${USER_BOOTSTRAP_ADMIN_EMAIL:}
    # Base64 AES-256 master: reset-token encryption and a derived HMAC key for auth quota identity.
    secret-key: ${USER_SECRET_KEY}
    # ADR-19 callers of /internal: service:base64-X.509 entries; empty allows none.
    internal-callers: ${USER_INTERNAL_CALLERS:}
    trusted-gateways: ${USER_TRUSTED_GATEWAYS:}
    rate-limit:
      login-limit: ${USER_LOGIN_RATE_LIMIT:20}
      login-window-seconds: ${USER_LOGIN_RATE_WINDOW_SECONDS:300}
      forgot-ip-limit: ${USER_FORGOT_IP_RATE_LIMIT:20}
      forgot-email-limit: ${USER_FORGOT_EMAIL_RATE_LIMIT:5}
      forgot-window-seconds: ${USER_FORGOT_RATE_WINDOW_SECONDS:3600}

logging:
  structured:
    format:
      # PLT-05: JSON (ECS) logs with trace ids; every string value is redacted (XCT-06).
      console: ecs
    json:
      customizer: vn.fashion.platform.security.PiiRedactingJsonCustomizer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
