server:
  port: ${SERVER_PORT:8087}

spring:
  kafka:
    consumer:
      group-id: notification-service
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  task:
    scheduling:
      pool:
        size: 1
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
      accept-float-as-int: false
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USERNAME:notification_runtime}
    password: ${NOTIFICATION_DB_PASSWORD:notification_runtime_local}
    hikari:
      maximum-pool-size: ${NOTIFICATION_DB_MAX_POOL_SIZE:10}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  cloud:
    # Nacos is off by default; profile nacos-compat enables it (O02 proof).
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  flyway:
    url: ${NOTIFICATION_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    user: ${NOTIFICATION_MIGRATION_DB_USERNAME:notification_migration}
    password: ${NOTIFICATION_MIGRATION_DB_PASSWORD:notification_migration_local}
    locations: classpath:db/migration

logging:
  structured:
    format:
      # PLT-05: JSON (ECS) logs with trace ids; every string value is redacted (XCT-06).
      console: ecs
    json:
      customizer: vn.fashion.platform.security.PiiRedactingJsonCustomizer

fashion:
  messaging:
    relay:
      # No outbox here (no results topic), so no relay.
      enabled: false
  notification:
    # Placeholders only; the owner fills real values per environment.
    shop-name: ${NOTIFICATION_SHOP_NAME:[TÊN SHOP]}
    hotline: ${NOTIFICATION_HOTLINE:[0000 000 000]}
    mail-from: ${NOTIFICATION_MAIL_FROM:no-reply@example.invalid}
    storefront-base-url: ${NOTIFICATION_STOREFRONT_BASE_URL:http://localhost:4173}
    public-asset-base-url: ${NOTIFICATION_PUBLIC_ASSET_BASE_URL:http://localhost:8080}
    message-id-domain: ${NOTIFICATION_MESSAGE_ID_DOMAIN:example.invalid}

management:
  # PLT-05: no OTLP endpoint here on purpose: an empty value still creates the exporter. Traces leave
  # the process only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (local compose: Tempo).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  observations:
    enable:
      tasks.scheduled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
