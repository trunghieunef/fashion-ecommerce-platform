server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker DNS, re-resolved so a recreated Gateway (new IP) does not cause 502s.
  resolver 127.0.0.11 valid=10s;

  # API goes to the Gateway; its 404s must stay 404, never index.html.
  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
  }
  location = /api {
    return 404;
  }

  # Missing build assets are real 404s.
  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback only for UI routes.
  location / {
    try_files $uri /index.html;
  }
}
